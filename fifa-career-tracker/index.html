"Read every player row you can see and return their totals for the season shown.\n\n" +
'Reply with ONLY a JSON object of this shape:\n' +
'{"season":"2025/26","club":"Ashfield United","players":[{"name":"J. Okafor","position":"ST","age":24,"nationality":"Nigeria","appearances":36,"goals":24,"assists":6,"cleanSheets":0,"rating":7.6}],"trophies":["Premier League"]}\n\n' +
"Rules:\n" +
"- One entry per player row. Keep the name exactly as it appears on screen.\n" +
"- position must be one of GK RB CB LB RWB LWB CDM CM CAM RM LM RW LW CF ST, or null if none is shown.\n" +
"- age is the player's age in years as a whole number if shown, otherwise null.\n" +
"- nationality is the country name written out in full (e.g. \"Nigeria\", not a flag or code), or null if not shown.\n" +
"- appearances, goals and assists are whole numbers; use 0 when the column is missing or blank.\n" +
"- cleanSheets is the clean-sheet count if the screen shows one (usually goalkeepers and defenders); use 0 otherwise.\n" +
"- rating is the average match rating out of 10, or null if not shown.\n" +
"- season is the season label if visible (e.g. \"2025/26\"), otherwise null. club is the team name if visible, otherwise null.\n" +
"- trophies: only competitions the screenshot clearly shows as won; otherwise an empty array.\n" +
"- Never invent a player, a number or a competition. If a value is unreadable, use null.";

const WAGE_PROMPT =
"These images are screenshots from an EA SPORTS FC / FIFA Career Mode screen showing player CONTRACTS — " +
"a squad hub with a wage column, a contract negotiation screen, a transfer list or a player's contract tab.\n\n" +
"Read every player row you can see and return their contract terms.\n\n" +
'Reply with ONLY a JSON object of this shape:\n' +
'{"currency":"£","club":"Ashfield United","players":[{"name":"J. Okafor","position":"ST","age":24,"nationality":"Nigeria","weeklyWage":78000,"contractUntil":2029,"value":52000000}]}\n\n' +
"Rules:\n" +
"- One entry per player row. Keep the name exactly as it appears on screen.\n" +
"- weeklyWage is the wage PER WEEK as a plain number of currency units: \"£78K\" is 78000, \"€1.2M\" is 1200000. " +
"If only a yearly salary is shown, divide it by 52 and round. Use null when no wage is shown.\n" +
"- contractUntil is the year the contract runs to: \"2029\" or \"30 Jun 2029\" is 2029. " +
"A length like \"3 years\" is not a year — use null for it.\n" +
"- value is the market or transfer value as a plain number, or null.\n" +
"- currency is the symbol on screen (£, € or $), or null.\n" +
"- position must be one of GK RB CB LB RWB LWB CDM CM CAM RM LM RW LW CF ST, or null if none is shown.\n" +
"- age is the player's age in years as a whole number if shown, otherwise null.\n" +
"- nationality is the country name written out in full (e.g. \"Nigeria\", not a flag or code), or null if not shown.\n" +
"- Never invent a player or a number. If a value is unreadable, use null.";

const SAMPLE_COPY = {
  not_granted: "You declined Claude access for this page, so screenshots can't be read here. Type the numbers in instead.",
  sampling_disabled: "Claude isn't available on this account, so screenshots can't be read. Type the numbers in instead.",
  not_declared: "Screenshot reading isn't enabled for this page.",
  images_unavailable: "This view can't send images to Claude. Type the numbers in instead.",
  image_rejected: "One of those files couldn't be read — use a PNG or JPEG screenshot under 20 MB.",
  rate_limited: "Too many requests just now. Wait a minute and try again.",
  session_expired: "Your Claude session expired. Reload the page and sign in again.",
  invalid_json: "The stats didn't come back in a readable shape. Try a tighter crop of the stats table.",
  empty_completion: "Nothing came back from that image. Try a clearer or closer screenshot.",
  refused: "Claude wouldn't read that image. Try a different screenshot.",
  prompt_too_large: "That's too much at once — import fewer screenshots per go.",
  cancelled: "Stopped."
};

const imp = {step:"pick", kind:"stats", files:[], rows:[], trophies:[], mode:"add", seasonId:null, newLabel:"",
  busy:false, ctl:null, error:"", found:null, currency:null, setCurrency:true};

function openImport() {
  guard();
  imp.files.forEach(f => URL.revokeObjectURL(f.url));
  imp.step = "pick"; imp.files = []; imp.rows = []; imp.trophies = []; imp.mode = "add";
  imp.busy = false; imp.error = ""; imp.found = null; imp.newLabel = nextSeasonLabel();
  imp.kind = state.route.view === "finances" ? "wages" : "stats";
  imp.currency = null; imp.setCurrency = true;
  imp.seasonId = state.scope !== "all" ? state.scope : ((seasonList().slice(-1)[0] || {}).id || "__new");
  onClose = () => { imp.files.forEach(f => URL.revokeObjectURL(f.url)); imp.files = []; };
  renderImport();
}

function renderImport() {
  if (imp.step === "review") return renderImportReview();
  const accept = imageLimits ? imageLimits.mediaTypes.join(",") : "image/*";
  const maxN = imageLimits ? imageLimits.maxCount : 4;
  const body =
    (sampleFn && imageLimits ? "" :
      '<div class="banner"><span>' + (sampleFn
        ? "This view can't send images to Claude, so screenshots can't be read here."
        : "Reading screenshots needs Claude, which isn't available in this view.") +
      " Everything can still be typed in by hand.</span></div>") +
    '<div class="radio-row">' +
      '<label class="radio-card"><input type="radio" name="impkind" value="stats"' + (imp.kind === "stats" ? " checked" : "") + '>' +
        '<span><span class="rc-t">Season stats</span><span class="rc-d">Apps, goals, assists, clean sheets, rating — filed under one season.</span></span></label>' +
      '<label class="radio-card"><input type="radio" name="impkind" value="wages"' + (imp.kind === "wages" ? " checked" : "") + '>' +
        '<span><span class="rc-t">Wages &amp; contracts</span><span class="rc-d">Weekly wage, contract expiry, market value — the player\'s current terms.</span></span></label>' +
    "</div>" +
    (imp.kind === "stats"
      ? '<div class="grid2">' +
          field("Season to fill", '<select id="impSeason">' + seasonOptions(imp.seasonId, true) + "</select>") +
          (imp.seasonId === "__new" ? field("New season label", '<input id="impLabel" value="' + esc(imp.newLabel) + '" maxlength="16">') : "<div></div>") +
        "</div>"
      : '<p class="note">Contracts are current terms, so they are not filed under a season. Anything the shot does not show is left as it is.</p>') +
    '<div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose screenshots">' +
      '<div class="d-t">Drop screenshots here, or click to choose</div>' +
      '<div class="note">' + (imp.kind === "wages"
        ? "Squad hub with a wage column, contract screens, transfer lists"
        : "Squad stats tables, player profiles, end-of-season summaries") + ' — up to ' + maxN + ' at a time. ' +
      'Claude reads the names and numbers; you check them before anything is saved.</div>' +
      '<input type="file" id="impFiles" accept="' + accept + '" multiple hidden>' +
    "</div>" +
    (imp.files.length ? '<div class="thumbs">' + imp.files.map((f,i) =>
      '<figure><img src="' + f.url + '" alt=""><button type="button" data-rmfile="' + i + '" aria-label="Remove">&times;</button>' +
      '<figcaption>' + esc(f.file.name) + "</figcaption></figure>").join("") + "</div>" : "") +
    (imp.error ? '<p class="err">' + esc(imp.error) + "</p>" : "") +
    (imp.busy ? '<div class="toolbar"><span class="spinner"></span><span class="note">Reading the screenshots… this usually takes 10–40 seconds.</span></div>' : "");

  const foot = imp.busy
    ? '<button class="btn" type="button" id="impStop">Stop</button>'
    : '<button class="btn" type="button" data-close>Cancel</button>' +
      '<button class="btn primary" type="button" id="impGo"' + (imp.files.length && sampleFn && imageLimits ? "" : " disabled") + ">Read screenshots</button>";

  openDialog("Import from screenshots", body, foot, () => {
    dlgBody.querySelectorAll('input[name="impkind"]').forEach(c => c.onchange = () => { imp.kind = c.value; imp.error = ""; renderImport(); });
    const sel = $("#impSeason");
    if (sel) sel.onchange = () => { imp.seasonId = sel.value; renderImport(); };
    const lab = $("#impLabel");
    if (lab) lab.oninput = () => { imp.newLabel = lab.value; };
    const drop = $("#drop"), input = $("#impFiles");
    if (drop) {
      drop.onclick = () => input.click();
      drop.onkeydown = ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); input.click(); } };
      drop.ondragover = ev => { ev.preventDefault(); drop.classList.add("over"); };
      drop.ondragleave = () => drop.classList.remove("over");
      drop.ondrop = ev => { ev.preventDefault(); drop.classList.remove("over"); addFiles(ev.dataTransfer.files); };
      input.onchange = () => addFiles(input.files);
    }
    dlgBody.querySelectorAll("[data-rmfile]").forEach(b => b.onclick = () => {
      const i = +b.dataset.rmfile; URL.revokeObjectURL(imp.files[i].url); imp.files.splice(i,1); renderImport();
    });
    const go = $("#impGo"); if (go) go.onclick = readShots;
    const stop = $("#impStop"); if (stop) stop.onclick = () => { if (imp.ctl) imp.ctl.abort(); };
  });
}

function addFiles(list) {
  const maxN = imageLimits ? imageLimits.maxCount : 4;
  const maxB = imageLimits ? imageLimits.maxInputBytes : 20 * 1024 * 1024;
  const types = imageLimits ? imageLimits.mediaTypes : ["image/png","image/jpeg","image/webp","image/gif"];
  imp.error = "";
  for (const f of Array.from(list || [])) {
    if (imp.files.length >= maxN) { imp.error = "Up to " + maxN + " screenshots per import."; break; }
    if (types.indexOf(f.type) < 0) { imp.error = f.name + " isn't a supported image (" + types.map(t => t.split("/")[1]).join(", ") + ")."; continue; }
    if (f.size > maxB) { imp.error = f.name + " is too large — keep screenshots under " + Math.floor(maxB / 1048576) + " MB."; continue; }
    imp.files.push({file:f, url:URL.createObjectURL(f)});
  }
  renderImport();
}

async function readShots() {
  if (!sampleFn || !imp.files.length) return;
  imp.busy = true; imp.error = ""; imp.ctl = new AbortController();
  renderImport();
  try {
    const out = await sampleFn.json(imp.kind === "wages" ? WAGE_PROMPT : IMPORT_PROMPT, {
      images: imp.files.map(f => f.file),
      modelTier: "default",
      signal: imp.ctl.signal
    });
    const players = (out && Array.isArray(out.players)) ? out.players : [];
    if (!players.length) {
      imp.busy = false;
      imp.error = imp.kind === "wages"
        ? "No contract rows were found in that image. Try a shot that shows the wage column."
        : "No player rows were found in that image. Try a screenshot of the stats table itself.";
      return renderImport();
    }
    imp.found = {season: out.season || null, club: out.club || null, shots: imp.files.length};
    const base = r => {
      const name = String(r && r.name != null ? r.name : "").trim().slice(0,40);
      const match = Object.values(Store.data.players).find(p => norm(p.name) === norm(name));
      const pos = POSITIONS.indexOf(String(r && r.position || "").toUpperCase()) >= 0 ? String(r.position).toUpperCase() : (match ? match.position : "");
      const age = int(r && r.age);
      const nationality = String(r && r.nationality || "").trim().slice(0,24);
      return {name:name, position:pos, age: age || null, nationality: nationality || null, playerId: match ? match.id : "__new", include: !!name};
    };
    if (imp.kind === "wages") {
      imp.currency = CURRENCIES.indexOf(out && out.currency) >= 0 ? out.currency : null;
      imp.setCurrency = !!imp.currency && imp.currency !== cur();
      imp.trophies = [];
      imp.rows = players.slice(0, 60).map(r => {
        const yr = int(r && r.contractUntil);
        return Object.assign(base(r), {
          wage: r && r.weeklyWage != null ? Math.round(num(r.weeklyWage)) : null,
          expiry: yr >= 1990 && yr <= 2100 ? yr : null,
          value: r && r.value != null ? Math.round(num(r.value)) : null
        });
      }).filter(r => r.name);
    } else {
      imp.trophies = (Array.isArray(out.trophies) ? out.trophies : []).filter(Boolean).map(n => ({name:String(n).slice(0,48), on:true}));
      imp.rows = players.slice(0, 60).map(r => Object.assign(base(r), {
        apps: int(r && r.appearances), goals: int(r && r.goals), assists: int(r && r.assists),
        cs: int(r && r.cleanSheets), rating: Math.min(10, num(r && r.rating))
      })).filter(r => r.name);
    }
    imp.busy = false; imp.step = "review"; renderImport();
  } catch (e) {
    imp.busy = false;
    imp.error = SAMPLE_COPY[e && e.code] || "The screenshots couldn't be read (" + ((e && e.code) || "error") + "). Try again, or type the numbers in.";
    renderImport();
  }
}

function targetSeasonLabel() {
  if (imp.seasonId === "__new") return imp.newLabel || nextSeasonLabel();
  const s = seasonById(imp.seasonId); return s ? s.label : "—";
}

function renderImportReview() {
  if (imp.kind === "wages") return renderWagesReview();
  const sid = imp.seasonId;
  const curVal = (pid, f) => {
    if (sid === "__new" || pid === "__new") return 0;
    const st = Store.data.stats[statKey(sid, pid)]; return st ? int(st[f]) : 0;
  };
  const players = Object.values(Store.data.players);
  const rowHtml = (r,i) => {
    const nextOf = f => imp.mode === "add" ? curVal(r.playerId, f) + r[f] : r[f];
    const before = curVal(r.playerId, "apps") + curVal(r.playerId, "goals") + curVal(r.playerId, "assists");
    return '<tr class="' + (r.include ? "" : "off") + '">' +
      '<td><input type="checkbox" data-inc="' + i + '"' + (r.include ? " checked" : "") + ' aria-label="Include ' + esc(r.name) + '"></td>' +
      '<td class="l"><input type="text" data-name="' + i + '" value="' + esc(r.name) + '"></td>' +
      '<td><select data-pos="' + i + '">' + positionOptions(r.position) + "</select></td>" +
      '<td><select data-pid="' + i + '"><option value="__new"' + (r.playerId === "__new" ? " selected" : "") + ">+ New player</option>" +
        players.map(p => '<option value="' + esc(p.id) + '"' + (r.playerId === p.id ? " selected" : "") + ">" + esc(p.name) + "</option>").join("") + "</select></td>" +
      '<td><input class="n" type="number" min="0" data-f="apps" data-i="' + i + '" value="' + r.apps + '"></td>' +
      '<td><input class="n" type="number" min="0" data-f="goals" data-i="' + i + '" value="' + r.goals + '"></td>' +
      '<td><input class="n" type="number" min="0" data-f="assists" data-i="' + i + '" value="' + r.assists + '"></td>' +
      '<td><input class="n" type="number" min="0" data-f="cs" data-i="' + i + '" value="' + r.cs + '"></td>' +
      '<td class="delta">' + (before || imp.mode === "replace"
        ? curVal(r.playerId,"goals") + "+" + curVal(r.playerId,"assists") + " → " + (nextOf("goals") + nextOf("assists"))
        : "new · " + (r.goals + r.assists) + " G+A") + "</td></tr>";
  };
  const found = imp.found || {shots:0};
  const mismatch = found.season && targetSeasonLabel() && norm(found.season) !== norm(targetSeasonLabel());

  const body =
    '<p class="note">Read <b>' + imp.rows.length + "</b> player" + (imp.rows.length === 1 ? "" : "s") + " from " + found.shots +
      " screenshot" + (found.shots === 1 ? "" : "s") + " into <b>" + esc(targetSeasonLabel()) + "</b>" +
      (found.club ? " · " + esc(found.club) : "") + ". Check the numbers before they are saved." + "</p>" +
    (mismatch ? '<div class="banner"><span>The screenshot looks like <b>' + esc(found.season) + '</b> but you are filling <b>' + esc(targetSeasonLabel()) + "</b>. Change the season on the previous step if that's wrong.</span></div>" : "") +
    '<div class="radio-row">' +
      '<label class="radio-card"><input type="radio" name="impmode" value="add"' + (imp.mode === "add" ? " checked" : "") + '>' +
        '<span><span class="rc-t">Add on top</span><span class="rc-d">Adds these numbers to what the season already holds.</span></span></label>' +
      '<label class="radio-card"><input type="radio" name="impmode" value="replace"' + (imp.mode === "replace" ? " checked" : "") + '>' +
        '<span><span class="rc-t">Replace the season</span><span class="rc-d">Overwrites the season with exactly these totals.</span></span></label>' +
    "</div>" +
    '<div class="table-scroll"><table class="review-table"><thead><tr><th></th><th class="l">Name</th><th>Pos</th><th class="l">Goes to</th>' +
      "<th>Apps</th><th>Goals</th><th>Assists</th><th>CS</th><th>G+A after</th></tr></thead><tbody>" +
      imp.rows.map(rowHtml).join("") + "</tbody></table></div>" +
    (imp.trophies.length ? '<div class="field"><label>Trophies spotted</label><div class="radio-row">' +
      imp.trophies.map((t,i) => '<label class="radio-card"><input type="checkbox" data-trophy="' + i + '"' + (t.on ? " checked" : "") + '>' +
        '<span><span class="rc-t">' + esc(t.name) + '</span><span class="rc-d">Files under ' + esc(targetSeasonLabel()) + "</span></span></label>").join("") + "</div></div>" : "") +
    (imp.error ? '<p class="err">' + esc(imp.error) + "</p>" : "");

  const n = imp.rows.filter(r => r.include).length;
  const foot = '<button class="btn" type="button" id="impBack">Back</button>' +
    '<button class="btn primary" type="button" id="impApply"' + (n ? "" : " disabled") + ">Save " + n + " player" + (n === 1 ? "" : "s") + " to " + esc(targetSeasonLabel()) + "</button>";

  openDialog("Check the numbers", body, foot, () => {
    dlgBody.querySelectorAll("[data-inc]").forEach(c => c.onchange = () => { imp.rows[+c.dataset.inc].include = c.checked; renderImportReview(); });
    dlgBody.querySelectorAll("[data-name]").forEach(c => c.onchange = () => { imp.rows[+c.dataset.name].name = c.value.trim(); });
    dlgBody.querySelectorAll("[data-pos]").forEach(c => c.onchange = () => { imp.rows[+c.dataset.pos].position = c.value; });
    dlgBody.querySelectorAll("[data-pid]").forEach(c => c.onchange = () => { imp.rows[+c.dataset.pid].playerId = c.value; renderImportReview(); });
    dlgBody.querySelectorAll("input.n").forEach(c => c.onchange = () => { imp.rows[+c.dataset.i][c.dataset.f] = int(c.value); renderImportReview(); });
    dlgBody.querySelectorAll("[data-trophy]").forEach(c => c.onchange = () => { imp.trophies[+c.dataset.trophy].on = c.checked; });
    dlgBody.querySelectorAll('input[name="impmode"]').forEach(c => c.onchange = () => { imp.mode = c.value; renderImportReview(); });
    $("#impBack").onclick = () => { imp.step = "pick"; renderImport(); };
    $("#impApply").onclick = applyImport;
  });
}

function renderWagesReview() {
  const players = Object.values(Store.data.players);
  const found = imp.found || {shots:0};
  const rowHtml = (r,i) => {
    const yrs = r.expiry ? r.expiry - nowYear() : null;
    const p = r.playerId === "__new" ? null : Store.data.players[r.playerId];
    return '<tr class="' + (r.include ? "" : "off") + '">' +
      '<td><input type="checkbox" data-inc="' + i + '"' + (r.include ? " checked" : "") + ' aria-label="Include ' + esc(r.name) + '"></td>' +
      '<td class="l"><input type="text" data-name="' + i + '" value="' + esc(r.name) + '"></td>' +
      '<td><select data-pos="' + i + '">' + positionOptions(r.position) + "</select></td>" +
      '<td><select data-pid="' + i + '"><option value="__new"' + (r.playerId === "__new" ? " selected" : "") + ">+ New player</option>" +
        players.map(x => '<option value="' + esc(x.id) + '"' + (r.playerId === x.id ? " selected" : "") + ">" + esc(x.name) + "</option>").join("") + "</select></td>" +
      '<td><input class="n" style="width:96px" type="number" min="0" step="500" data-w="' + i + '" value="' + (r.wage == null ? "" : r.wage) + '" placeholder="' + (p && num(p.wage) ? p.wage : "—") + '"></td>' +
      '<td><input class="n" style="width:70px" type="number" min="1990" max="2100" data-e="' + i + '" value="' + (r.expiry == null ? "" : r.expiry) + '" placeholder="' + (p && int(p.expiry) ? p.expiry : "—") + '"></td>' +
      '<td><input class="n" style="width:110px" type="number" min="0" step="100000" data-v="' + i + '" value="' + (r.value == null ? "" : r.value) + '" placeholder="' + (p && num(p.value) ? p.value : "—") + '"></td>' +
      '<td>' + (yrs === null ? '<span class="delta">unchanged</span>' : leftChip(yrs)) + "</td></tr>";
  };
  const n = imp.rows.filter(r => r.include).length;

  const body =
    '<p class="note">Read <b>' + imp.rows.length + "</b> contract" + (imp.rows.length === 1 ? "" : "s") + " from " + found.shots +
      " screenshot" + (found.shots === 1 ? "" : "s") + ". Wages are per week" +
      (imp.currency ? " in <b>" + esc(imp.currency) + "</b>" : "") + "; a box left blank keeps the value the player already has.</p>" +
    (imp.currency && imp.currency !== cur()
      ? '<label class="radio-card" style="max-width:none"><input type="checkbox" id="impCur"' + (imp.setCurrency ? " checked" : "") + ">" +
        '<span><span class="rc-t">Switch the club currency to ' + esc(imp.currency) + '</span>' +
        '<span class="rc-d">Your ledger is in ' + esc(cur()) + " at the moment.</span></span></label>"
      : "") +
    '<div class="table-scroll"><table class="review-table" style="min-width:720px"><thead><tr><th></th><th class="l">Name</th><th>Pos</th>' +
      '<th class="l">Goes to</th><th>Weekly (' + esc(imp.currency || cur()) + ')</th><th>Expires</th><th>Value</th><th>Contract</th>' +
      "</tr></thead><tbody>" + imp.rows.map(rowHtml).join("") + "</tbody></table></div>" +
    (imp.error ? '<p class="err">' + esc(imp.error) + "</p>" : "");

  const foot = '<button class="btn" type="button" id="impBack">Back</button>' +
    '<button class="btn primary" type="button" id="impApply"' + (n ? "" : " disabled") + ">Save " + n + " contract" + (n === 1 ? "" : "s") + "</button>";

  openDialog("Check the contracts", body, foot, () => {
    dlgBody.querySelectorAll("[data-inc]").forEach(c => c.onchange = () => { imp.rows[+c.dataset.inc].include = c.checked; renderWagesReview(); });
    dlgBody.querySelectorAll("[data-name]").forEach(c => c.onchange = () => { imp.rows[+c.dataset.name].name = c.value.trim(); });
    dlgBody.querySelectorAll("[data-pos]").forEach(c => c.onchange = () => { imp.rows[+c.dataset.pos].position = c.value; });
    dlgBody.querySelectorAll("[data-pid]").forEach(c => c.onchange = () => { imp.rows[+c.dataset.pid].playerId = c.value; renderWagesReview(); });
    dlgBody.querySelectorAll("[data-w]").forEach(c => c.onchange = () => { imp.rows[+c.dataset.w].wage = c.value === "" ? null : Math.round(num(c.value)); });
    dlgBody.querySelectorAll("[data-e]").forEach(c => c.onchange = () => { imp.rows[+c.dataset.e].expiry = c.value === "" ? null : int(c.value); renderWagesReview(); });
    dlgBody.querySelectorAll("[data-v]").forEach(c => c.onchange = () => { imp.rows[+c.dataset.v].value = c.value === "" ? null : Math.round(num(c.value)); });
    const cc = $("#impCur"); if (cc) cc.onchange = () => { imp.setCurrency = cc.checked; };
    $("#impBack").onclick = () => { imp.step = "pick"; renderImport(); };
    $("#impApply").onclick = applyWages;
  });
}

async function applyWages() {
  const btn = $("#impApply"); if (btn) { btn.disabled = true; btn.textContent = "Saving…"; }
  if (imp.setCurrency && imp.currency && imp.currency !== cur()) await Store.setMeta({currency: imp.currency});
  let saved = 0;
  for (const r of imp.rows) {
    if (!r.include || !r.name) continue;
    let pid = r.playerId;
    if (pid === "__new" || !Store.data.players[pid]) {
      pid = uid("p");
      await Store.put("players", pid, {name:r.name, position:r.position, age:r.age || "", nationality:r.nationality || ""});
    }
    const p = Store.data.players[pid];
    const patch = Object.assign({}, p);
    if (r.position && !p.position) patch.position = r.position;
    if (r.age && !p.age) patch.age = r.age;
    if (r.nationality && !p.nationality) patch.nationality = r.nationality;
    if (r.wage != null) patch.wage = r.wage;
    if (r.expiry != null) patch.expiry = r.expiry;
    if (r.value != null) patch.value = r.value;
    await Store.put("players", pid, patch);
    saved++;
  }
  modal.close();
  if (state.route.view !== "finances") location.hash = "#/finances";
  else render();
  notice("Saved " + saved + " contract" + (saved === 1 ? "" : "s") + ".", "info");
}

async function applyImport() {
  if (imp.kind === "wages") return applyWages();
  const btn = $("#impApply"); if (btn) { btn.disabled = true; btn.textContent = "Saving…"; }
  let sid = imp.seasonId;
  if (sid === "__new") {
    sid = uid("s");
    const order = (seasonList().slice(-1)[0] || {order:0}).order + 1;
    await Store.put("seasons", sid, {label: imp.newLabel || nextSeasonLabel(), club: Store.data.meta.club || "", order: order});
  }
  let added = 0;
  for (const r of imp.rows) {
    if (!r.include || !r.name) continue;
    let pid = r.playerId;
    if (pid === "__new" || !Store.data.players[pid]) {
      pid = uid("p");
      await Store.put("players", pid, {name:r.name, position:r.position, age:r.age || "", nationality:r.nationality || ""});
    } else {
      const p = Store.data.players[pid];
      const patch = {};
      if (r.position && p.position !== r.position) patch.position = r.position;
      if (r.age && !p.age) patch.age = r.age;
      if (r.nationality && !p.nationality) patch.nationality = r.nationality;
      if (Object.keys(patch).length) await Store.put("players", pid, Object.assign({}, p, patch));
    }
    const key = statKey(sid, pid);
    const prev = Store.data.stats[key] || {apps:0, goals:0, assists:0, cleanSheets:0, rating:0};
    const body = imp.mode === "add"
      ? {seasonId:sid, playerId:pid, apps:int(prev.apps) + r.apps, goals:int(prev.goals) + r.goals,
         assists:int(prev.assists) + r.assists, cleanSheets:int(prev.cleanSheets) + r.cs, rating: r.rating || num(prev.rating)}
      : {seasonId:sid, playerId:pid, apps:r.apps, goals:r.goals, assists:r.assists, cleanSheets:r.cs, rating:r.rating};
    await Store.put("stats", key, body);
    added++;
  }
  for (const t of imp.trophies) {
    if (!t.on) continue;
    const dupe = Object.values(Store.data.trophies).some(x => x.seasonId === sid && norm(x.name) === norm(t.name));
    if (!dupe) await Store.put("trophies", uid("t"), {name:t.name, seasonId:sid, type: /league|liga|serie|bundes|ligue|eredivisie/i.test(t.name) ? "League" : /champions|europa|conference|super|world/i.test(t.name) ? "Continental" : /cup|pokal|coupe|copa/i.test(t.name) ? "Domestic cup" : "Other"});
  }
  state.scope = sid;
  modal.close();
  render();
  notice("Saved " + added + " player" + (added === 1 ? "" : "s") + " to " + (seasonById(sid) || {label:""}).label + ".", "info");
}

/* ---------------- routing -------------------------------------------- */
function parseHash() {
  const h = String(location.hash || "").replace(/^#\/?/, "");
  const parts = h.split("/");
  if (parts[0] === "finances") return {view:"finances", id:null};
  if (parts[0] === "roster") return {view:"roster", id:null};
  if (parts[0] === "player" && parts[1]) return {view:"player", id:decodeURIComponent(parts[1])};
  return {view:"overview", id:null};
}
function closeDrawer() { $("#side").classList.remove("open"); $("#scrim").hidden = true; }
window.addEventListener("hashchange", () => {
  state.route = parseHash();
  closeDrawer();
  render();
  window.scrollTo(0, 0);
});
document.addEventListener("click", e => { if (e.target.closest && e.target.closest("a")) closeDrawer(); });

function tileText(label, text, sub, cls) {
  return '<div class="tile ' + (cls || "") + '"><span class="eyebrow">' + esc(label) + '</span>' +
    '<span class="t-val">' + text + '</span><span class="t-sub">' + sub + '</span></div>';
}
const plink = p => '<a class="plink" href="#/player/' + encodeURIComponent(p.id) + '">' + esc(p.name) + '</a>';

/* ---------------- view: wages & finances ------------------------------ */
function sortFin(rows) {
  const k = state.fsort.key, dir = state.fsort.dir === "asc" ? 1 : -1;
  return rows.slice().sort((a,b) => {
    if (k === "name") return dir * String(a.p.name).localeCompare(String(b.p.name));
    if (k === "nation") return dir * String(a.p.nationality || "￿").localeCompare(String(b.p.nationality || "￿"));
    if (k === "age") return dir * ((int(a.p.age) || 999) - (int(b.p.age) || 999));
    if (k === "left") { const av = a.left === null ? 999 : a.left, bv = b.left === null ? 999 : b.left; return dir * (av - bv); }
    return dir * ((a[k] - b[k]) || String(a.p.name).localeCompare(String(b.p.name)));
  });
}

          '<td>' + money(T.w) + '</td><td></td><td></td><td></td>' +
          '<td>' + money(T.d, "compact") + '</td><td>' + money(T.s, "compact") + '</td><td>' + money(T.n, "compact") + "</td></tr></tfoot></table></div>";

  const earners = rows.filter(r => r.weekly > 0).sort((a,b) => b.weekly - a.weekly).slice(0,5);

    "</div></div>" + table + "</section>";

  const sel = $("#curSelect");
  if (sel) sel.onchange = async () => { if (demoOn()) exitDemo(); await Store.setMeta({currency: sel.value}); render(); };

    '<section class="tiles">' + [

      tile("Assists", all.assists, all.apps ? (all.assists / all.apps).toFixed(2) + " per appearance" : "—"),
      tile("Goal contributions", all.contrib, all.apps ? (all.contrib / all.apps).toFixed(2) + " per appearance" : "—", "is-contrib"),
      (showCS ? tile("Clean sheets", all.cs, all.apps ? Math.round(all.cs / all.apps * 100) + "% of appearances" : "—") : ""),
      tileText("Avg rating", all.rating ? all.rating.toFixed(2) : "—", "weighted by appearances")

      '<span class="note">Type in any row — it saves to that season</span></div>' + seasonTable + "</section>" +

        await Store.put("players", p.id, Object.assign({}, p, {
          name:name, position:$("#ePos").value, number:int($("#eNum").value) || "", age:int($("#eAge").value) || "",
          nationality:$("#eNat").value.trim(), joined:$("#eJoined").value.trim(), from:$("#eFrom").value.trim()
        }));
        modal.close(); render();
      };
      $("#eDelete").onclick = async () => {
        modal.close();
        if (!await askConfirm("Delete " + p.name + " for good?",
          "Every season recorded for them is deleted with them. To keep the record instead, close this and use Remove from squad.", "Delete player")) return;
        for (const k of Object.keys(Store.data.stats)) if (Store.data.stats[k].playerId === p.id) await Store.remove("stats", k);
        await Store.remove("players", p.id);
        location.hash = "#/";
        render();
      };
    });
}

  openDialog("Remove " + p.name + " from the squad",

    'They come off the squad list and the wage bill, and move to <b>Moved on</b> in the sidebar. You can bring them back whenever you like.</p>' +
    '<div class="grid2">' +

      field("Moved to (optional)", '<input id="lTo" value="' + esc(p.leftTo || "") + '" maxlength="40" placeholder="Marseille">') +
    "</div>",
    '<button class="btn" type="button" data-close>Cancel</button>' +
    '<button class="btn primary" type="button" id="okLeave">Remove from squad</button>',

      }));

let dealDraft = [];
function openDeals(id) {
  const p = view().players[id]; if (!p) return;
  if (demoOn()) { exitDemo(); render(); notice("Example cleared — add your own squad first.", "info"); return; }
  dealDraft = (p.deals || []).map(x => ({brand:String(x.brand || ""), annual:num(x.annual)}));
  if (!dealDraft.length) dealDraft.push({brand:"", annual:0});
  drawDeals(p);
}
function drawDeals(p) {
  const total = dealDraft.reduce((a,x) => a + num(x.annual), 0);
  const irPct = Math.min(100, num(p.imageRights));
  openDialog("Brand deals · " + p.name,
    '<div class="table-scroll"><table class="review-table" style="min-width:420px"><thead><tr>' +
      '<th class="l">Sponsor</th><th class="l">Per year (' + cur() + ')</th><th></th></tr></thead><tbody>' +
      dealDraft.map((x,i) =>
        '<tr><td class="l"><input type="text" data-db="' + i + '" value="' + esc(x.brand) + '" placeholder="Nitro Boots"></td>' +
        '<td class="l"><input class="n" style="width:110px" type="number" min="0" step="50000" data-da="' + i + '" value="' + (x.annual || "") + '"></td>' +
        '<td><button class="row-x" type="button" data-dx="' + i + '" aria-label="Remove">&times;</button></td></tr>').join("") +
      "</tbody></table></div>" +
    '<div class="toolbar"><button class="btn ghost" type="button" id="dAdd">+ Add another</button>' +
      '<span class="note">' + money(total, "compact") + " a year · club keeps " + (irPct || 0) + "% = <b>" + money(total * irPct / 100, "compact") + "</b></span></div>",
    '<button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="button" id="dSave">Save deals</button>',
    () => {
      dlgBody.querySelectorAll("[data-db]").forEach(el => el.onchange = () => { dealDraft[+el.dataset.db].brand = el.value; drawDeals(p); });
      dlgBody.querySelectorAll("[data-da]").forEach(el => el.onchange = () => { dealDraft[+el.dataset.da].annual = num(el.value); drawDeals(p); });
      dlgBody.querySelectorAll("[data-dx]").forEach(el => el.onclick = () => { dealDraft.splice(+el.dataset.dx, 1); drawDeals(p); });
      $("#dAdd").onclick = () => { dealDraft.push({brand:"", annual:0}); drawDeals(p); };
      $("#dSave").onclick = async () => {
        const deals = dealDraft.filter(x => String(x.brand).trim()).map(x => ({brand:String(x.brand).trim().slice(0,40), annual:Math.round(num(x.annual))}));
        await Store.put("players", p.id, Object.assign({}, view().players[p.id] || p, {deals:deals}));
        modal.close(); render();
      };
    });
}

/* ---------------- boot ------------------------------------------------ */
(async function boot() {
  state.route = parseHash();
  render();
  await Store.init(render);
  render();
  try {
    sampleFn = window.claude && claude.use ? await claude.use("sample") : null;
    if (sampleFn) {
      const caps = await sampleFn.limits().catch(() => null);
      imageLimits = caps && caps.images ? caps.images : null;
    }
  } catch (e) { sampleFn = null; }
  const btn = $("#btnImport");
  btn.title = sampleFn && imageLimits ? "Read a squad screenshot with Claude" : "Screenshot reading is unavailable in this view";
})();
</script>
