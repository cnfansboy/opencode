<title>Career Mode Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
:root{
  --ground:#ECEFE9; --surface:#FFFFFF; --surface-2:#F4F7F1; --surface-3:#E7EBE3;
  --line:#D5DCD2; --line-strong:#BDC7B9;
  --ink:#101A14; --ink-2:#54635A; --ink-3:#7C8B81;
  --accent:#0F6B45; --accent-soft:#DDEBE2; --accent-ink:#0B5637;
  --gold:#8F6613; --gold-soft:#F3E9D2; --gold-line:#DCC48A;
  --goals:#0F6B45; --assists:#7A4FC0;
  --gk:#8F6613; --def:#2C5AA0; --mid:#0F6B45; --att:#A83A2B;
  --danger:#A83A2B;
  --shadow:0 1px 2px rgba(16,26,20,.06), 0 8px 24px -18px rgba(16,26,20,.5);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0B100D; --surface:#141B17; --surface-2:#1A231D; --surface-3:#222D26;
    --line:#26332B; --line-strong:#38493E;
    --ink:#E7EFE8; --ink-2:#95A69A; --ink-3:#75887C;
    --accent:#2E9A6C; --accent-soft:#16281F; --accent-ink:#7FD3AC;
    --gold:#D8AC4A; --gold-soft:#2A2317; --gold-line:#5A4820;
    --goals:#2E9A6C; --assists:#9A79DE;
    --gk:#D8AC4A; --def:#7BA6E8; --mid:#2E9A6C; --att:#E08072;
    --danger:#E08072;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -20px #000;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0B100D; --surface:#141B17; --surface-2:#1A231D; --surface-3:#222D26;
  --line:#26332B; --line-strong:#38493E;
  --ink:#E7EFE8; --ink-2:#95A69A; --ink-3:#75887C;
  --accent:#2E9A6C; --accent-soft:#16281F; --accent-ink:#7FD3AC;
  --gold:#D8AC4A; --gold-soft:#2A2317; --gold-line:#5A4820;
  --goals:#2E9A6C; --assists:#9A79DE;
  --gk:#D8AC4A; --def:#7BA6E8; --mid:#2E9A6C; --att:#E08072;
  --danger:#E08072;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -20px #000;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--ground); color:var(--ink);
  font-family:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0; text-wrap:balance}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}
.wrap{max-width:1200px; margin-inline:auto; padding:22px 18px 90px}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.eyebrow{
  font-family:"IBM Plex Mono",monospace; font-size:10.5px; font-weight:500;
  letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3);
}
.num{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}

/* ---------- masthead ---------- */
.masthead{
  display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between;
  gap:14px; padding-bottom:16px; border-bottom:2px solid var(--ink); margin-bottom:14px;
}
.crest{display:flex; align-items:center; gap:14px}
.crest-mark{
  width:38px; height:38px; flex:none; border-radius:6px; background:var(--accent);
  display:grid; place-items:center; color:#fff;
  font-family:"Anton",Impact,sans-serif; font-size:19px; letter-spacing:.02em;
  box-shadow:inset 0 -14px 0 rgba(0,0,0,.14);
}
#clubName{
  font-family:"Anton",Impact,"Arial Narrow",sans-serif; font-weight:400;
  font-size:17px; line-height:1.1; letter-spacing:.005em;
  text-transform:uppercase; background:none; border:0; padding:2px 4px; margin-left:-4px;
  color:var(--ink); width:100%; border-radius:4px;
}
#clubName:hover{background:var(--surface-3)}
#clubName:focus{background:var(--surface); outline:2px solid var(--accent)}
.mast-right{display:flex; flex-direction:column; align-items:flex-end; gap:7px}
.chip-row{display:flex; gap:7px; align-items:center; flex-wrap:wrap; justify-content:flex-end}
.status{
  display:inline-flex; align-items:center; gap:6px; padding:4px 9px; border-radius:999px;
  border:1px solid var(--line); background:var(--surface); font-size:11.5px; color:var(--ink-2);
  font-family:"IBM Plex Mono",monospace;
}
.status i{width:6px; height:6px; border-radius:50%; background:var(--accent); flex:none}
.status.local i{background:var(--gold)}

/* ---------- season rail ---------- */
.rail-wrap{margin-bottom:20px}
.rail{
  display:flex; gap:7px; overflow-x:auto; padding:3px 2px 9px; scrollbar-width:thin;
}
.season-chip{
  flex:none; display:flex; flex-direction:column; gap:1px; align-items:flex-start;
  padding:7px 14px; border-radius:7px; cursor:pointer; white-space:nowrap;
  border:1px solid var(--line); background:var(--surface); color:var(--ink-2);
  transition:border-color .12s, color .12s, background .12s;
}
.season-chip:hover{border-color:var(--line-strong); color:var(--ink)}
.season-chip .sc-label{font-family:"IBM Plex Mono",monospace; font-size:13px; font-weight:500; letter-spacing:.01em}
.season-chip .sc-meta{font-size:10.5px; color:var(--ink-3)}
.season-chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff}
.season-chip[aria-pressed="true"] .sc-meta{color:rgba(255,255,255,.78)}
.season-chip.add{border-style:dashed; color:var(--ink-3); justify-content:center}

/* ---------- generic panel ---------- */
.panel{
  background:var(--surface); border:1px solid var(--line); border-radius:10px;
  padding:16px 16px 15px; box-shadow:var(--shadow);
}
.panel-head{display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:8px 12px; margin-bottom:14px}
.panel-head h2{flex:0 0 auto}
.panel-head h2{font-size:14px; font-weight:700; letter-spacing:.01em}
.legend{display:flex; gap:12px; align-items:center}
.legend span{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; color:var(--ink-2)}
.swatch{width:9px; height:9px; border-radius:2px; flex:none}
.sw-goals{background:var(--goals)} .sw-assists{background:var(--assists)}

/* ---------- tiles ---------- */
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:18px}
.tile{
  background:var(--surface); border:1px solid var(--line); border-radius:10px;
  padding:13px 14px 12px; display:flex; flex-direction:column; gap:2px; box-shadow:var(--shadow);
}
.tile .t-val{
  font-family:"Anton",Impact,sans-serif; font-size:38px; line-height:1; letter-spacing:.01em;
  font-variant-numeric:tabular-nums;
}
.tile .t-sub{font-size:11px; color:var(--ink-3)}
.tile.is-trophies{background:var(--gold-soft); border-color:var(--gold-line)}
.tile.is-trophies .t-val{color:var(--gold)}
.tile.is-contrib .t-val{color:var(--accent)}
button.tile.clickable{
  font:inherit; text-align:left; cursor:pointer; width:100%; -webkit-appearance:none; appearance:none;
  transition:border-color .12s, transform .05s;
}
.tile.clickable:hover{border-color:var(--accent)}
.tile.clickable:active{transform:translateY(1px)}
.tile.clickable .t-sub{text-decoration:underline; text-decoration-color:var(--line-strong); text-underline-offset:2px}
.tile.clickable:hover .t-sub{text-decoration-color:var(--accent)}

/* ---------- layout rows ---------- */
.duo{display:grid; grid-template-columns:1.55fr 1fr; gap:14px; margin-bottom:14px; align-items:start}
@media (max-width:860px){ .duo{grid-template-columns:1fr} }

/* ---------- leaderboard ---------- */
.lb{display:flex; flex-direction:column; gap:11px}
.lb-row{display:grid; grid-template-columns:minmax(120px,168px) 1fr; gap:12px; align-items:center}
.lb-id{display:flex; flex-direction:column; gap:2px; min-width:0}
.lb-name{display:flex; align-items:center; gap:6px; min-width:0}
.lb-rank{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-3); flex:none}
.lb-name b{font-weight:600; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.lb-meta{font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--ink-3)}
.lb-track{display:flex; align-items:center; gap:9px}
.bar{display:flex; gap:2px; height:15px; flex:1; min-width:0}
.seg{height:100%; min-width:2px}
.seg.g{background:var(--goals); border-radius:4px 0 0 4px}
.seg.a{background:var(--assists); border-radius:0 4px 4px 0}
.seg.only{border-radius:4px}
.seg:hover{filter:brightness(1.08)}
.lb-total{font-family:"IBM Plex Mono",monospace; font-size:13px; font-weight:600; width:34px; text-align:right; flex:none}
.lb-row.top .lb-name b{color:var(--accent)}
#tip{
  position:fixed; z-index:60; pointer-events:none; opacity:0; transform:translate(-50%,-124%);
  background:var(--ink); color:var(--ground); padding:5px 9px; border-radius:6px;
  font-family:"IBM Plex Mono",monospace; font-size:11.5px; white-space:nowrap; transition:opacity .1s;
}

/* ---------- trophy cabinet ---------- */
.cab{display:flex; flex-direction:column; gap:13px}
.cab-season{display:flex; flex-direction:column; gap:6px}
.cab-season .cs-head{display:flex; align-items:baseline; gap:8px}
.cab-season .cs-head .yr{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-2)}
.cab-season .cs-head .rule{flex:1; height:1px; background:var(--line)}
.trophy{
  display:flex; align-items:center; gap:9px; padding:7px 9px; border-radius:7px;
  background:var(--gold-soft); border:1px solid var(--gold-line);
}
.trophy .tr-ico{color:var(--gold); flex:none; display:grid; place-items:center}
.trophy .tr-name{font-weight:600; font-size:13px; flex:1; min-width:0}
.trophy .tr-type{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--gold)}

/* ---------- squad table ---------- */
.table-scroll{overflow-x:auto; margin:0 -16px; padding:0 16px}
.stack-table{min-width:560px}
@media (max-width:600px){
  .stack-table{min-width:0; width:100%}
  .stack-table thead{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
  .stack-table, .stack-table tbody, .stack-table tfoot, .stack-table tr, .stack-table td{display:block; width:auto}
  .stack-table tbody tr{
    border:1px solid var(--line); border-radius:9px; padding:10px 13px 3px; margin-bottom:9px; background:var(--surface-2);
  }
  .stack-table tfoot tr{border-top:2px solid var(--ink); padding:12px 2px 4px; margin-top:2px}
  .stack-table td{
    display:flex; justify-content:space-between; align-items:center; gap:14px;
    padding:7px 0; border-bottom:1px dashed var(--line); text-align:right;
  }
  .stack-table tr > td:last-child{border-bottom:0}
  .stack-table td:empty{display:none}
  .stack-table td[data-label]::before{
    content:attr(data-label); font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--ink-3); text-align:left; flex:none;
  }
  .stack-table td.stat-head{
    font-family:"Anton",Impact,sans-serif; font-weight:400; font-size:19px; text-transform:uppercase;
    border-bottom:1px solid var(--line); padding:2px 0 9px; margin-bottom:2px; text-align:left; letter-spacing:.01em;
  }
  .stack-table input.cell{width:96px}
}
table{border-collapse:collapse; width:100%; min-width:640px}
th{
  text-align:right; font-family:"IBM Plex Mono",monospace; font-weight:500; font-size:10.5px;
  letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3);
  padding:0 8px 8px; border-bottom:1px solid var(--line); white-space:nowrap;
}
th:first-child,th.l{text-align:left}
th button{background:none; border:0; padding:0; font:inherit; letter-spacing:inherit; color:inherit; cursor:pointer}
th button:hover{color:var(--ink)}
th[aria-sort] button{color:var(--ink)}
th .caret{opacity:.75}
td{padding:9px 8px; border-bottom:1px solid var(--line); text-align:right; vertical-align:middle}
td:first-child,td.l{text-align:left}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
.p-name{font-weight:600; font-size:14px; white-space:nowrap}
.pos{
  display:inline-block; min-width:34px; text-align:center; padding:2px 6px; border-radius:4px;
  font-family:"IBM Plex Mono",monospace; font-size:10.5px; font-weight:600; letter-spacing:.06em;
  border:1px solid currentColor;
}
.pos.gk{color:var(--gk)} .pos.def{color:var(--def)} .pos.mid{color:var(--mid)} .pos.att{color:var(--att)}
td.stat{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-size:13.5px}
td.contrib{font-weight:600; color:var(--accent)}
input.cell{
  width:56px; padding:5px 7px; text-align:right; border:1px solid var(--line); border-radius:5px;
  background:var(--surface-2); color:var(--ink);
  font-family:"IBM Plex Mono",monospace; font-size:13px; font-variant-numeric:tabular-nums;
}
input.cell:hover{border-color:var(--line-strong)}
input.cell:focus{background:var(--surface); border-color:var(--accent); outline:none}
input.cell::-webkit-outer-spin-button,input.cell::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}
input.cell[type=number]{-moz-appearance:textfield}
.row-x{
  background:none; border:0; cursor:pointer; color:var(--ink-3); padding:4px 6px; border-radius:5px; line-height:1;
}
.row-x:hover{color:var(--danger); background:var(--surface-3)}
tfoot td{
  border-top:2px solid var(--ink); border-bottom:0; padding-top:10px;
  font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:13.5px;
}
tfoot td:first-child{font-family:"Public Sans",sans-serif; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); font-weight:500}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex; align-items:center; gap:6px; padding:7px 13px; border-radius:7px; cursor:pointer;
  border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:13px; font-weight:500;
  transition:border-color .12s, background .12s;
}
.btn:hover{border-color:var(--line-strong); background:var(--surface-2)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.primary:hover{filter:brightness(1.07); background:var(--accent)}
.btn.ghost{border-color:transparent; background:none; color:var(--ink-2); padding-inline:8px}
.btn.ghost:hover{color:var(--ink); background:var(--surface-3)}
.btn.danger{color:var(--danger); border-color:transparent; background:none}
.btn.danger:hover{background:var(--surface-3)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.toolbar{display:flex; gap:8px; flex-wrap:wrap; align-items:center}

/* ---------- banners & notes ---------- */
.banner{
  display:flex; gap:12px; align-items:center; flex-wrap:wrap; justify-content:space-between;
  padding:10px 14px; border-radius:9px; margin-bottom:14px; font-size:13px;
  background:var(--gold-soft); border:1px solid var(--gold-line); color:var(--ink);
}
.banner b{color:var(--gold)}
.note{font-size:12px; color:var(--ink-3)}
.empty{padding:22px 6px; text-align:center; color:var(--ink-3); font-size:13px}
.empty b{display:block; color:var(--ink-2); font-size:14px; margin-bottom:4px}

/* ---------- dialog ---------- */
dialog{
  border:1px solid var(--line); border-radius:12px; background:var(--surface); color:var(--ink);
  padding:0; width:min(640px,calc(100vw - 28px)); max-height:88vh; overflow:auto; box-shadow:0 24px 60px -20px rgba(0,0,0,.45);
}
dialog::backdrop{background:rgba(8,14,10,.55)}
.dlg-head{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:15px 18px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--surface); z-index:2;
}
.dlg-head h3{font-size:15px; font-weight:700}
.dlg-body{padding:18px; display:flex; flex-direction:column; gap:15px}
.dlg-foot{
  display:flex; justify-content:flex-end; gap:8px; padding:13px 18px; border-top:1px solid var(--line);
  position:sticky; bottom:0; background:var(--surface);
}
.field{display:flex; flex-direction:column; gap:5px}
.field > label{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
.field input,.field select,.field textarea{
  padding:9px 11px; border-radius:7px; border:1px solid var(--line); background:var(--surface-2);
  color:var(--ink); font:inherit; font-size:14px; width:100%;
}
.field input:focus,.field select:focus{background:var(--surface); border-color:var(--accent); outline:none}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.grid4{display:grid; grid-template-columns:repeat(auto-fit,minmax(104px,1fr)); gap:10px}
@media (max-width:560px){ .grid4{grid-template-columns:repeat(2,1fr)} .grid2{grid-template-columns:1fr} }
.radio-row{display:flex; gap:9px; flex-wrap:wrap}
.radio-card{
  flex:1; min-width:180px; display:flex; gap:9px; align-items:flex-start; padding:10px 12px;
  border:1px solid var(--line); border-radius:8px; cursor:pointer; background:var(--surface-2);
}
.radio-card input{margin-top:3px; accent-color:var(--accent)}
.radio-card:has(input:checked){border-color:var(--accent); background:var(--accent-soft)}
.radio-card .rc-t{font-weight:600; font-size:13px}
.radio-card .rc-d{font-size:11.5px; color:var(--ink-2)}
.drop{
  border:1.5px dashed var(--line-strong); border-radius:10px; padding:24px 16px; text-align:center;
  background:var(--surface-2); cursor:pointer;
}
.drop.over{border-color:var(--accent); background:var(--accent-soft)}
.drop .d-t{font-weight:600; font-size:14px; margin-bottom:3px}
.thumbs{display:flex; gap:8px; flex-wrap:wrap}
.thumbs figure{margin:0; position:relative; width:96px}
.thumbs img{width:96px; height:66px; object-fit:cover; border-radius:6px; border:1px solid var(--line); display:block}
.thumbs figcaption{font-size:10px; color:var(--ink-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:3px}
.thumbs button{position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--ink-2); cursor:pointer; line-height:1; font-size:12px; padding:0}
.review-table td,.review-table th{padding:6px 6px}
.review-table input[type=text]{width:100%; min-width:110px; padding:5px 7px; border-radius:5px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink); font:inherit; font-size:13px}
.review-table input.n{width:52px; text-align:right; font-family:"IBM Plex Mono",monospace}
.review-table select{padding:5px 6px; border-radius:5px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink); font:inherit; font-size:12.5px}
.review-table tr.off{opacity:.4}
.delta{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-3); white-space:nowrap}
.spinner{
  width:15px; height:15px; border-radius:50%; border:2px solid var(--line-strong); border-top-color:var(--accent);
  animation:spin .7s linear infinite; flex:none;
}
@keyframes spin{to{transform:rotate(360deg)}}
.err{color:var(--danger); font-size:13px}
@media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important} }

/* ---------- app shell ---------- */
.shell{display:grid; grid-template-columns:246px minmax(0,1fr); min-height:100vh}
.side{
  position:sticky; top:0; align-self:start; height:100vh; display:flex; flex-direction:column;
  border-right:1px solid var(--line); background:var(--surface); padding:16px 0 0;
}
.side-top{display:flex; gap:11px; align-items:center; padding:0 16px 14px; border-bottom:1px solid var(--line)}
.side-id{min-width:0; flex:1}
.side-nav{display:flex; flex-direction:column; gap:2px; padding:12px 10px; border-bottom:1px solid var(--line)}
.nav-item{
  display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:7px; cursor:pointer;
  color:var(--ink-2); text-decoration:none; font-size:13.5px; font-weight:500; border:0; background:none; width:100%; text-align:left;
}
.nav-item:hover{background:var(--surface-2); color:var(--ink)}
.nav-item[aria-current="page"]{background:var(--accent-soft); color:var(--accent-ink); font-weight:600}
.nav-item svg{flex:none; opacity:.85}
.nav-item .nv{margin-left:auto; font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-3)}
.side-squad{flex:1; min-height:0; display:flex; flex-direction:column; padding:12px 10px 0}
.side-h{display:flex; justify-content:space-between; padding:0 6px 7px}
.side-list{overflow-y:auto; display:flex; flex-direction:column; gap:1px; padding-bottom:10px}
.sq-item{
  display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:6px; text-decoration:none;

function flagEmoji(code) {
  if (code === "GB-ENG") return "🏴󠁧󠁢󠁥󠁮󠁧󠁿";
  if (code === "GB-SCT") return "🏴󠁧󠁢󠁳󠁣󠁴󠁿";

  if (!code || code.length !== 2) return "";
  return String.fromCodePoint(...[...code.toUpperCase()].map(c => 127397 + c.charCodeAt(0)));
}

function nationTag(p, compact) {

const LEAGUE_INFO = {};
LEAGUE_GROUPS.forEach(g => g.tiers.forEach((name, i) => { LEAGUE_INFO[name] = {country:g.country, tier:i + 1}; }));
function leagueOptions(sel) {
  return '<option value=""' + (sel ? "" : " selected") + '>Not set</option>' +
    LEAGUE_GROUPS.map(g => '<optgroup label="' + esc(g.country) + '">' +
      g.tiers.map(name => '<option value="' + esc(name) + '"' + (name === sel ? " selected" : "") + '>' + esc(name) + '</option>').join("") +
      "</optgroup>").join("");
}
function leagueTag(name) {
  if (!name) return "";
  const info = LEAGUE_INFO[name];
  const flag = info ? flagFor(info.country) : "";
  return '<span class="league-tag' + (info && info.tier === 1 ? " tier1" : "") + '">' +
    (flag ? '<span class="flag" role="img" aria-label="' + esc(info.country) + '">' + flag + '</span>' : "") +

}

  data: EMPTY(),
  ready: false,

  async init(onChange) {
    this.onChange = onChange;
    const pending = (window.claude && claude.use) ? claude.use("db").catch(() => null) : Promise.resolve(null);
    const TIMEOUT = {};
    let db = await Promise.race([pending, new Promise(r => setTimeout(() => r(TIMEOUT), 2500))]);
    if (db === TIMEOUT) {
      db = null;
      pending.then(late => { if (late && !this.db && isEmpty(this.data)) { this.data = EMPTY(); this.bindCloud(late); } });
    }
    if (db) { this.bindCloud(db); }
    else {
      this.mode = "local";
      try { const raw = localStorage.getItem(LS_KEY); if (raw) this.data = Object.assign(EMPTY(), JSON.parse(raw)); } catch (e) {}
      this.ready = true;
    }
  },

  bindCloud(db) {
      this.db = db; this.mode = "cloud"; this.ready = false;
      const bind = (coll, key) => db.collection(coll).onSnapshot(
        snap => {
          const next = {};
          snap.docs.forEach(d => { next[d.id] = Object.assign({id:d.id}, d.data()); });
          this.data[key] = next; this.ready = true; this.onChange();
        },
        err => notice("Cloud storage stopped syncing (" + err.code + "). Your last saved data is still shown.", "warn")
      );
      bind("seasons","seasons"); bind("players","players"); bind("stats","stats"); bind("trophies","trophies");
      db.doc("meta/career").onSnapshot(d => {
        this.data.meta = d.exists ? d.data() : {club:"", currency:"£"}; this.ready = true; this.onChange();
      }, () => {});
      setTimeout(() => { if (!this.ready) { this.ready = true; this.onChange(); } }, 1800);
      this.onChange();
  },

  saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(this.data)); } catch (e) {} },

  async put(coll, id, body) {
    const doc = Object.assign({}, body, {id: id});
    this.data[coll][id] = doc;
    if (this.db) {
      try { await this.db.doc(coll + "/" + id).set(doc); }
      catch (e) { notice(dbCopy(e), "warn"); }
    } else { this.saveLocal(); }
    this.onChange();
  },

  async remove(coll, id) {
    delete this.data[coll][id];
    if (this.db) { try { await this.db.doc(coll + "/" + id).delete(); } catch (e) { notice(dbCopy(e), "warn"); } }
    else { this.saveLocal(); }
    this.onChange();
  },

  async setMeta(patch) {
    this.data.meta = Object.assign({}, this.data.meta, patch);
    if (this.db) { try { await this.db.doc("meta/career").set(this.data.meta); } catch (e) { notice(dbCopy(e), "warn"); } }
    else { this.saveLocal(); }
  }
};

function dbCopy(e) {
  const c = e && e.code;
  if (c === "quota_exceeded") return "The career database is full. Delete an old season to make room.";
  if (c === "resource_exhausted") return "Too many changes at once — wait a moment and try again.";
  if (c === "revoked") return "Storage access ended for this view. Reload the page to keep saving.";
  return "That change did not save (" + (c || "unknown") + "). Try again.";
}

/* ---------------- app state ---------------------------------------- */
const state = {
  scope: "all",
  route: {view:"overview", id:null},
  sort: {key:"contrib", dir:"desc"},
  fsort: {key:"weekly", dir:"desc"},
  asort: {key:"contrib", dir:"desc"},
  notice: null,
  demoDismissed: (() => { try { return localStorage.getItem(LS_DEMO) === "1"; } catch (e) { return false; } })()
};
let sampleFn = null, imageLimits = null;

const isEmpty = d => !Object.keys(d.seasons).length && !Object.keys(d.players).length && !Object.keys(d.trophies).length;
const demoOn = () => !state.demoDismissed && (!Store.ready || isEmpty(Store.data));
const view = () => demoOn() ? DEMO : Store.data;

function exitDemo() {
  if (!demoOn()) return;
  state.demoDismissed = true;
  try { localStorage.setItem(LS_DEMO, "1"); } catch (e) {}
}
function notice(text, kind) {
  state.notice = {text: text, kind: kind || "info"};
  render();
  clearTimeout(notice.t);
  notice.t = setTimeout(() => { state.notice = null; render(); }, 7000);
}

/* ---------------- derived data -------------------------------------- */
const seasonList = () => Object.values(view().seasons).sort((a,b) => (a.order||0) - (b.order||0) || String(a.label).localeCompare(String(b.label)));
const seasonById = id => view().seasons[id];
const statKey = (s,p) => s + "__" + p;

function rowsFor(scope) {
  const d = view();
  const stats = Object.values(d.stats);
  return Object.values(d.players).map(p => {
    let apps = 0, goals = 0, assists = 0, cs = 0, rw = 0, rn = 0;
    for (const s of stats) {
      if (s.playerId !== p.id) continue;
      if (scope !== "all" && s.seasonId !== scope) continue;
      apps += int(s.apps); goals += int(s.goals); assists += int(s.assists); cs += int(s.cleanSheets);
      if (num(s.rating) > 0) { const w = int(s.apps) || 1; rw += num(s.rating) * w; rn += w; }
    }
    return {p:p, apps:apps, goals:goals, assists:assists, cs:cs, contrib:goals + assists, rating: rn ? rw / rn : 0};
  });
}
function squadRows(scope) {
  return rowsFor(scope).filter(r => !r.p.departed);
}
const leftTag = p => p.departed
  ? '<span class="chip muted left-tag">left' + (int(p.leftYear) ? " " + int(p.leftYear) : "") + "</span>"
  : "";
function trophiesFor(scope) {
  return Object.values(view().trophies).filter(t => scope === "all" || t.seasonId === scope);
}
function sortRows(rows, sort) {
  sort = sort || state.sort;
  const k = sort.key, dir = sort.dir === "asc" ? 1 : -1;
  return rows.slice().sort((a,b) => {
    if (k === "name") return dir * String(a.p.name).localeCompare(String(b.p.name));
    if (k === "pos") return dir * (POSITIONS.indexOf(a.p.position) - POSITIONS.indexOf(b.p.position));
    if (k === "nation") return dir * String(a.p.nationality || "￿").localeCompare(String(b.p.nationality || "￿"));
    if (k === "age") return dir * ((int(a.p.age) || 999) - (int(b.p.age) || 999));
    if (k === "status") return dir * ((a.p.departed ? 1 : 0) - (b.p.departed ? 1 : 0));
    return dir * ((a[k] - b[k]) || String(a.p.name).localeCompare(String(b.p.name)) * -dir);
  });
}
const fmt = n => Number(n).toLocaleString("en-GB");
const keepsSheets = p => UNIT[p.position] === "gk" || UNIT[p.position] === "def";
const bestSheets = rows => rows.slice().sort((a,b) => b.cs - a.cs)[0];
const CURRENCIES = ["£","€","$"];
const cur = () => (view().meta && view().meta.currency) || "£";
function money(n, style) {
  n = Math.round(num(n));
  if (style === "compact") {
    if (n >= 1e6) return cur() + String((n / 1e6).toFixed(n >= 1e7 ? 0 : 1)).replace(/\.0$/, "") + "M";
    if (n >= 1e4) return cur() + Math.round(n / 1e3) + "K";
  }
  return cur() + n.toLocaleString("en-GB");
}
/* the year the newest recorded season ends — contracts count down from it */
function nowYear() {
  const last = seasonList().slice(-1)[0];
  if (last) {
    const m = String(last.label).match(/(\d{4})\s*\/\s*(\d{2,4})/);
    if (m) return +m[1] + 1;
    const y = String(last.label).match(/(\d{4})/);
    if (y) return +y[1];
  }
  return new Date().getFullYear();
}
const yearsLeft = p => int(p.expiry) ? int(p.expiry) - nowYear() : null;
const dealTotal = p => (p.deals || []).reduce((a,d) => a + num(d.annual), 0);
function finRows() {
  return Object.values(view().players).map(p => {
    const weekly = num(p.wage), deals = dealTotal(p), ir = Math.min(100, num(p.imageRights));
    const share = deals * ir / 100;
    return {p:p, weekly:weekly, annual:weekly * 52, deals:deals, ir:ir, share:share, net:weekly * 52 - share, left:yearsLeft(p)};
  });
}
function leftChip(left) {
  if (left === null) return '<span class="chip muted">not set</span>';
  if (left < 0) return '<span class="chip crit">expired</span>';
  if (left === 0) return '<span class="chip crit">final year</span>';
  if (left === 1) return '<span class="chip warn">1 yr left</span>';
  return '<span class="chip">' + left + " yrs left</span>";
}
const rate = n => n ? n.toFixed(2) : "—";

/* ---------------- rendering ----------------------------------------- */
function render() {
  const d = view();
  const scope = (state.scope !== "all" && !d.seasons[state.scope]) ? "all" : state.scope;
  state.scope = scope;

  /* club identity */
  const club = (d.meta && d.meta.club) || "";
  const nameEl = $("#clubName");
  if (document.activeElement !== nameEl) nameEl.value = club;
  $("#crest").textContent = (club || "Career Mode").split(/\s+/).slice(0,2).map(w => w[0] || "").join("").toUpperCase() || "CM";

  /* storage status */
  $("#statusRow").innerHTML = Store.mode === "cloud"
    ? '<span class="status"><i></i>Saved to this page</span>'
    : Store.mode === "local"
      ? '<span class="status local"><i></i>Saved in this browser</span>'
      : '<span class="status local"><i></i>Checking storage…</span>';

  /* banner */
  const bits = [];
  if (state.notice) bits.push('<div class="banner"><span>' + esc(state.notice.text) + '</span></div>');
  if (demoOn()) bits.push(
    '<div class="banner"><span><b>Example career.</b> These are sample numbers so you can see the layout — ' +
    'add a season, a player or a screenshot and the ledger starts empty for your own save.</span>' +
    '<button class="btn" id="btnClearDemo" type="button">Start my career</button></div>');
  $("#banner").innerHTML = bits.join("");

  renderSidebar();

  const v = state.route.view;
  $("#viewOverview").hidden = v !== "overview";
  $("#viewFinances").hidden = v !== "finances";
  $("#viewPlayer").hidden = v !== "player";
  $("#viewRoster").hidden = v !== "roster";
  if (v === "finances") renderFinances();
  else if (v === "player") renderPlayerPage(state.route.id);
  else if (v === "roster") renderRoster();
  else renderOverview(scope);
}

const ICON = {

  coin: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M14.5 9.2A3 3 0 0 0 9.6 10c0 2.6 5 1.4 5 4a3 3 0 0 1-5.1 1M12 7v10"/></svg>',
  roster: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><path d="M16.5 5.5A3 3 0 0 1 17 11.4M20 19a5 5 0 0 0-3.8-6.4"/></svg>'
};

function renderSidebar() {
  const d = view();
  const players = Object.values(d.players).sort((x,y) =>
    (POSITIONS.indexOf(x.position) - POSITIONS.indexOf(y.position)) || String(x.name).localeCompare(String(y.name)));
  const v = state.route.view;
  const weekly = finRows().filter(r => !r.p.departed).reduce((a,r) => a + r.weekly, 0);
  const nav = (href, icon, label, on, meta) =>
    '<a class="nav-item" href="' + href + '"' + (on ? ' aria-current="page"' : "") + '>' + icon +
    '<span>' + label + '</span>' + (meta ? '<span class="nv">' + meta + '</span>' : "") + '</a>';
  $("#sideNav").innerHTML =
    nav("#/", ICON.pitch, "Squad &amp; seasons", v === "overview", seasonList().length ? seasonList().length + " szn" : "") +
    nav("#/finances", ICON.coin, "Wages &amp; finances", v === "finances", weekly ? money(weekly, "compact") + "/wk" : "") +
    nav("#/roster", ICON.roster, "All-time players", v === "roster", players.length || "");
  const item = p => '<a class="sq-item" href="#/player/' + encodeURIComponent(p.id) + '"' +
    (v === "player" && state.route.id === p.id ? ' aria-current="page"' : "") + '>' +
    posChip(p.position) + (flagFor(p.nationality) ? '<span class="sq-flag" role="img" aria-label="' + esc(p.nationality) + '">' + flagFor(p.nationality) + '</span>' : "") +
    '<span class="sq-name">' + esc(p.name) + '</span>' +
    '<span class="sq-n">' + (p.number ? "#" + esc(p.number) : "") + '</span></a>';
  const active = players.filter(p => !p.departed);
  $("#squadCount").textContent = active.length || "";
  $("#sideList").innerHTML = active.length ? active.map(item).join("")
    : '<div class="side-empty">No current players. Add one, or import a squad screenshot.</div>';
}

/* ---------------- view: squad &amp; seasons -------------------------- */
function renderOverview(scope) {
  const rows = squadRows(scope);
  const seasons = seasonList();
  const cur = scope === "all" ? null : seasonById(scope);
  $("#pageTitle").textContent = cur ? "Squad · " + cur.label : "All-time squad";

  const railBits = [chip("all", "All seasons", seasons.length + (seasons.length === 1 ? " season" : " seasons"), scope === "all")];
  seasons.forEach(s => {
    const played = rowsFor(s.id).reduce((m,r) => Math.max(m, r.apps), 0);
    const info = s.league ? LEAGUE_INFO[s.league] : null;
    const meta = s.league ? (info ? flagFor(info.country) + " " : "") + esc(s.league)
      : s.club ? esc(s.club) : (played ? played + " apps" : "no stats yet");
    railBits.push(chip(s.id, s.label, meta, scope === s.id));
  });
  railBits.push('<button class="season-chip add" id="btnSeason" type="button"><span class="sc-label">+ Season</span></button>');
  $("#rail").innerHTML = railBits.join("");

  $("#scopeNote").innerHTML = cur
    ? "Showing <b>" + esc(cur.label) + "</b> only — type in the squad table to record this season." +
      (cur.league ? " " + leagueTag(cur.league) : "") +
      ' <button class="btn ghost" type="button" data-editseason="' + esc(cur.id) + '" style="padding:2px 8px;font-size:12px">Edit season</button>' +
      ' <button class="btn danger" type="button" id="btnDelSeason" style="padding:2px 8px;font-size:12px">Delete season</button>'
    : "All-time totals across every season you have recorded.";

  const trophies = trophiesFor(scope);
  const leader = key => rows.slice().sort((a,b) => b[key] - a[key])[0];
  const topApps = leader("apps"), topGoals = leader("goals"), topAssists = leader("assists"), topContrib = leader("contrib");
  const sheets = bestSheets(rows);
  const leadSub = (top, val) => top && val ? "Most: " + esc(top.p.name) : "none recorded";
  $("#tiles").innerHTML = [
    tile("Appearances", topApps ? topApps.apps : 0, leadSub(topApps, topApps && topApps.apps), "", "apps"),
    tile("Goals", topGoals ? topGoals.goals : 0, leadSub(topGoals, topGoals && topGoals.goals), "", "goals"),
    tile("Assists", topAssists ? topAssists.assists : 0, leadSub(topAssists, topAssists && topAssists.assists), "", "assists"),
    tile("Goal contributions", topContrib ? topContrib.contrib : 0, leadSub(topContrib, topContrib && topContrib.contrib), "is-contrib", "contrib"),
    tile("Clean sheets", sheets && sheets.cs ? sheets.cs : 0, sheets && sheets.cs ? "kept by " + esc(sheets.p.name) : "none recorded", "", "cs"),
    tile("Trophies", trophies.length, trophies.length ? "Latest: " + esc(latestTrophy(trophies).name) : "none yet", "is-trophies")
  ].join("");

  renderLeaderboard(rows);
  renderCabinet(scope);
  renderSquad(rows, cur);
}

function latestTrophy(list) {
  const rank = {};
  seasonList().forEach((s,i) => { rank[s.id] = i; });
  return list.slice().sort((a,b) => (rank[b.seasonId] || 0) - (rank[a.seasonId] || 0))[0];
}
function chip(id, label, meta, on) {
  return '<button class="season-chip" type="button" data-season="' + esc(id) + '" aria-pressed="' + (on ? "true" : "false") + '">' +
    '<span class="sc-label">' + esc(label) + '</span><span class="sc-meta">' + meta + '</span></button>';
}
function tile(label, value, sub, cls, statKey) {
  const tag = statKey ? "button" : "div";
  const open = "<" + tag + ' class="tile' + (cls ? " " + cls : "") + (statKey ? " clickable" : "") + '"' +
    (statKey ? ' type="button" data-stattile="' + statKey + '"' : "") + ">";
  return open + '<span class="eyebrow">' + esc(label) + '</span>' +
    '<span class="t-val">' + fmt(value) + '</span><span class="t-sub">' + sub + '</span></' + tag + '>';
}
function posChip(pos) {
  const p = POSITIONS.indexOf(pos) >= 0 ? pos : "—";
  return '<span class="pos ' + (UNIT[p] || "") + '">' + esc(p) + '</span>';
}

function renderLeaderboard(rows) {
  const top = rows.filter(r => r.contrib > 0).sort((a,b) => b.contrib - a.contrib || b.goals - a.goals).slice(0,5);
  if (!top.length) {
    $("#leader").innerHTML = '<div class="empty"><b>No goals or assists yet</b>Record a season and the leaderboard fills in.</div>';
    return;
  }
  const max = top[0].contrib;
  $("#leader").innerHTML = '<div class="lb">' + top.map((r,i) => {
    const gw = (r.goals / max) * 100, aw = (r.assists / max) * 100;
    const segs = [];
    if (r.goals) segs.push('<span class="seg g' + (r.assists ? "" : " only") + '" style="width:' + gw + '%" data-tip="Goals ' + r.goals + '"></span>');
    if (r.assists) segs.push('<span class="seg a' + (r.goals ? "" : " only") + '" style="width:' + aw + '%" data-tip="Assists ' + r.assists + '"></span>');
    return '<div class="lb-row' + (i === 0 ? " top" : "") + '">' +
      '<div class="lb-id"><span class="lb-name"><span class="lb-rank">' + (i + 1) + '</span>' +
        '<b><a class="plink" href="#/player/' + encodeURIComponent(r.p.id) + '">' + esc(r.p.name) + '</a></b>' + posChip(r.p.position) + '</span>' +
        '<span class="lb-meta">' + r.goals + ' G · ' + r.assists + ' A' + (r.apps ? ' · ' + (r.contrib / r.apps).toFixed(2) + ' per app' : '') +
          (r.p.departed ? " · left" : "") + '</span></div>' +
      '<div class="lb-track"><span class="bar">' + segs.join("") + '</span>' +
        '<span class="lb-total">' + r.contrib + '</span></div></div>';
  }).join("") + '</div>';
}

function renderCabinet(scope) {
  const list = trophiesFor(scope);

    $("#cabinet").innerHTML = '<div class="empty"><b>Cabinet is empty</b>Add every trophy the team wins — league titles, cups, promotions.</div>';

  const orphan = list.filter(t => !view().seasons[t.seasonId]);
  const blocks = order.map(s =>
    '<div class="cab-season"><div class="cs-head"><span class="yr">' + esc(s.label) + '</span><span class="rule"></span>' +

function renderSquad(rows, cur) {

  $("#squad").innerHTML =
    '<thead><tr>' + th("name","Player","l") + th("pos","Pos","l") + th("nation","Nation","l") + th("age","Age") +
      th("apps","Apps") + th("goals","Goals") +
      th("assists","Assists") + th("contrib","G+A") + (showCS ? th("cs","Clean sheets") : "") +
      (showRating ? th("rating","Rating") : "") + '<th aria-label="Remove"></th></tr></thead>' +
    '<tbody>' + sorted.map(r =>
      '<tr><td class="l p-name">' +
      '<a class="plink" href="#/player/' + encodeURIComponent(r.p.id) + '">' + esc(r.p.name) + '</a></td>' +
      '<td class="l">' + posChip(r.p.position) + '</td>' +

/* ---------------- view: all-time players ------------------------------ */
function renderRoster() {
  $("#pageTitle").textContent = "All-time players";
  const rows = rowsFor("all");
  const activeCount = rows.filter(r => !r.p.departed).length;
  const goneCount = rows.length - activeCount;

  if (!rows.length) {
    $("#viewRoster").innerHTML =
      '<div class="empty"><b>No players recorded yet</b>Add a player, or import a squad screenshot, and they land here for good — ' +
      'even after they leave the club.</div>';
    return;
  }

  const leader = key => rows.slice().sort((a,b) => b[key] - a[key])[0];
  const topApps = leader("apps"), topGoals = leader("goals"), topAssists = leader("assists"), topContrib = leader("contrib");
  const sheets = bestSheets(rows);
  const leadSub = (top, val) => top && val ? "Most: " + esc(top.p.name) : "none recorded";
  const tilesHtml = [
    tile("Appearances", topApps ? topApps.apps : 0, leadSub(topApps, topApps && topApps.apps), "", "apps"),
    tile("Goals", topGoals ? topGoals.goals : 0, leadSub(topGoals, topGoals && topGoals.goals), "", "goals"),
    tile("Assists", topAssists ? topAssists.assists : 0, leadSub(topAssists, topAssists && topAssists.assists), "", "assists"),
    tile("Goal contributions", topContrib ? topContrib.contrib : 0, leadSub(topContrib, topContrib && topContrib.contrib), "is-contrib", "contrib"),
    tile("Clean sheets", sheets && sheets.cs ? sheets.cs : 0, sheets && sheets.cs ? "kept by " + esc(sheets.p.name) : "none recorded", "", "cs")
  ].join("");

  const showRating = rows.some(r => r.rating > 0);
  const showCS = rows.some(r => r.cs > 0);
  const sorted = sortRows(rows, state.asort);
  const th = (key, label, cls) => {
    const on = state.asort.key === key;
    const caret = on ? (state.asort.dir === "asc" ? " ▲" : " ▼") : "";
    return '<th' + (cls ? ' class="' + cls + '"' : "") + (on ? ' aria-sort="' + (state.asort.dir === "asc" ? "ascending" : "descending") + '"' : "") +
      '><button type="button" data-asort="' + key + '">' + label + '<span class="caret">' + caret + '</span></button></th>';
  };

  const table = '<div class="table-scroll"><table style="min-width:820px"><thead><tr>' +
      th("name","Player","l") + th("pos","Pos","l") + th("nation","Nation","l") + th("age","Age") +
      th("status","Status","l") + th("apps","Apps") + th("goals","Goals") + th("assists","Assists") + th("contrib","G+A") +
      (showCS ? th("cs","Clean sheets") : "") + (showRating ? th("rating","Rating") : "") +
      '<th aria-label="Actions"></th></tr></thead><tbody>' +
    sorted.map(r =>
      '<tr' + (r.p.departed ? ' class="gone"' : "") + '><td class="l p-name">' +
      '<a class="plink" href="#/player/' + encodeURIComponent(r.p.id) + '">' + esc(r.p.name) + '</a></td>' +
      '<td class="l">' + posChip(r.p.position) + '</td>' +
      '<td class="l">' + nationTag(r.p) + '</td>' +
      '<td class="stat age">' + (int(r.p.age) || "—") + '</td>' +
      '<td class="l">' + (r.p.departed ? leftTag(r.p) : '<span class="chip">current</span>') + '</td>' +
      '<td class="stat">' + fmt(r.apps) + '</td>' +
      '<td class="stat">' + fmt(r.goals) + '</td>' +
      '<td class="stat">' + fmt(r.assists) + '</td>' +
      '<td class="stat contrib">' + fmt(r.contrib) + '</td>' +
      (showCS ? '<td class="stat">' + fmt(r.cs) + '</td>' : "") +
      (showRating ? '<td class="stat">' + (r.rating ? r.rating.toFixed(2) : "—") + '</td>' : "") +
      '<td>' + (r.p.departed
        ? '<button class="row-x" type="button" data-return="' + esc(r.p.id) + '" aria-label="Bring ' + esc(r.p.name) + ' back">&#8630;</button>'
        : '<button class="row-x" type="button" data-leave="' + esc(r.p.id) + '" aria-label="Remove ' + esc(r.p.name) + ' from the squad">&times;</button>') +
      "</td></tr>").join("") +
    "</tbody></table></div>";

  $("#viewRoster").innerHTML =
    '<p class="note" style="margin-bottom:14px">Every player who has been part of the club, past and present — ' +
    activeCount + " current" + (goneCount ? ", " + goneCount + " moved on" : "") +
    '. The <a class="plink" href="#/">squad dashboard</a> only shows who\'s at the club now; club records here cover everyone who ever played.</p>' +
    '<section class="tiles">' + tilesHtml + "</section>" +
    '<section class="panel"><div class="panel-head"><h2>Player roster</h2><div class="toolbar">' +
      '<span class="note">Career totals — not tied to one season</span>' +
      '<button class="btn ghost" type="button" id="btnPlayer3">+ Player</button>' +
    "</div></div>" + table + "</section>";
}

/* focus survives a re-render while typing in the table */
const origRender = render;
render = function () {
  const a = document.activeElement;
  const key = a && a.dataset ? a.dataset.focuskey : null;
  origRender();
  if (key) {
    const el = document.querySelector('[data-focuskey="' + key + '"]');
    if (el && el !== document.activeElement) { el.focus(); if (el.select) el.select(); }
  }
};

/* ---------------- dialog plumbing ------------------------------------ */
const modal = $("#modal"), dlgBody = $("#dlgBody"), dlgFoot = $("#dlgFoot"), dlgTitle = $("#dlgTitle");
let onClose = null;

function sigOf(el) {
  if (!el || !el.dataset || !dlgBody.contains(el)) return null;
  if (el.id) return "#" + el.id;
  const keys = ["i","f","name","pos","pid","inc","trophy"];
  const parts = keys.filter(k => el.dataset[k] !== undefined).map(k => '[data-' + k + '="' + el.dataset[k] + '"]');
  return parts.length ? el.tagName.toLowerCase() + parts.join("") : null;
}
function openDialog(title, body, foot, after) {
  const sig = sigOf(document.activeElement);
  dlgTitle.textContent = title;
  dlgBody.innerHTML = body;
  dlgFoot.innerHTML = foot;
  if (!modal.open) modal.showModal();
  if (after) after();
  let back = sig ? dlgBody.querySelector(sig) : null;
  if (!back) back = dlgBody.querySelector("input,select,button,textarea");
  if (back) back.focus();
}
function askConfirm(title, message, label) {
  return new Promise(resolve => {
    let done = false;
    onClose = () => { if (!done) { done = true; resolve(false); } };
    openDialog(title, '<p style="margin:0">' + esc(message) + "</p>",
      '<button class="btn" type="button" data-close>Cancel</button>' +
      '<button class="btn primary" type="button" id="okConfirm">' + esc(label) + "</button>",
      () => { $("#okConfirm").onclick = () => { done = true; onClose = null; modal.close(); resolve(true); }; });
  });
}
/* Enter in any field runs the dialog's main action instead of closing it */
$("#dlgForm").addEventListener("submit", e => {
  e.preventDefault();
  const primary = dlgFoot.querySelector(".btn.primary");
  if (primary && !primary.disabled) primary.click();
});
modal.addEventListener("close", () => { if (onClose) { const f = onClose; onClose = null; f(); } });

const field = (label, inner) => '<div class="field"><label>' + label + "</label>" + inner + "</div>";
const seasonOptions = (sel, extra) =>
  seasonList().slice().reverse().map(s => '<option value="' + esc(s.id) + '"' + (s.id === sel ? " selected" : "") + ">" + esc(s.label) + "</option>").join("") +
  (extra ? '<option value="__new"' + (sel === "__new" ? " selected" : "") + ">+ New season…</option>" : "");
const positionOptions = sel => '<option value="">—</option>' + POSITIONS.map(p => '<option' + (p === sel ? " selected" : "") + ">" + p + "</option>").join("");

function nextSeasonLabel() {
  const last = seasonList().slice(-1)[0];
  if (!last) { const y = new Date().getFullYear(); return y + "/" + String(y + 1).slice(2); }
  const m = String(last.label).match(/(\d{4})\s*\/\s*(\d{2,4})/);
  if (m) { const y = +m[1] + 1; return y + "/" + String(y + 1).slice(2); }
  const y = String(last.label).match(/(\d{4})/);
  return y ? String(+y[1] + 1) : "";
}

const STAT_LABELS = {apps:"Appearances", goals:"Goals", assists:"Assists", contrib:"Goal contributions", cs:"Clean sheets"};
function openStatLeaders(key) {
  const allTime = state.route.view === "roster";
  const scopeLabel = allTime ? "Club record" : (state.scope === "all" ? "All-time" : ((seasonById(state.scope) || {}).label || ""));
  const source = allTime ? rowsFor("all") : squadRows(state.scope);
  const rows = source.filter(r => r[key] > 0).sort((a,b) => b[key] - a[key] || String(a.p.name).localeCompare(String(b.p.name))).slice(0, 10);
  const max = rows.length ? rows[0][key] : 1;
  const body = rows.length
    ? '<div class="lb">' + rows.map((r,i) => {
        const rate = key !== "apps" && r.apps ? (r[key] / r.apps).toFixed(2) + " per app" : "";
        const meta = rate + (r.p.departed ? (rate ? " · " : "") + "left" + (int(r.p.leftYear) ? " " + int(r.p.leftYear) : "") : "");
        return '<div class="lb-row' + (i === 0 ? " top" : "") + '"><div class="lb-id"><span class="lb-name">' +
          '<span class="lb-rank">' + (i + 1) + '</span><b>' + plink(r.p) + '</b>' + posChip(r.p.position) + '</span>' +
          '<span class="lb-meta">' + meta + '</span></div>' +
          '<div class="lb-track"><span class="bar"><span class="seg w" style="width:' + (r[key] / max * 100) + '%"></span></span>' +
          '<span class="lb-total">' + fmt(r[key]) + '</span></div></div>';
      }).join("") + '</div>'
    : '<div class="empty"><b>Nothing recorded yet</b>Record some stats and the leaders appear here.</div>';
  openDialog((STAT_LABELS[key] || "Leaders") + " · " + scopeLabel, body,
    '<button class="btn" type="button" data-close>Close</button>',
    () => { dlgBody.querySelectorAll("a.plink").forEach(a => a.addEventListener("click", () => modal.close())); });

/* ---------------- events --------------------------------------------- */
document.addEventListener("click", async e => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.hasAttribute("data-close")) { modal.close(); return; }
  if (t.id === "btnClearDemo") { exitDemo(); render(); notice("Example cleared. Add a season to start your own career.", "info"); return; }
  if (t.id === "btnSeason") return openSeason();
  if (t.id === "btnPlayer" || t.id === "btnPlayer2" || t.id === "btnPlayer3") return openPlayer();
  if (t.id === "btnTrophy" || t.id === "btnTrophy2") return openTrophy();
  if (t.id === "btnImport") return openImport();
  if (t.dataset.stattile) return openStatLeaders(t.dataset.stattile);
  if (t.id === "btnMenu") { $("#side").classList.add("open"); $("#scrim").hidden = false; return; }
  if (t.id === "scrim") { closeDrawer(); return; }
  if (t.dataset.editplayer) return openEditPlayer(t.dataset.editplayer);
  if (t.dataset.editseason) return openEditSeason(t.dataset.editseason);
  if (t.dataset.contract) return openContract(t.dataset.contract);
  if (t.dataset.deals) return openDeals(t.dataset.deals);
  if (t.dataset.fsort) {
    const k = t.dataset.fsort;
    state.fsort = state.fsort.key === k
      ? {key:k, dir:state.fsort.dir === "asc" ? "desc" : "asc"}
      : {key:k, dir:k === "name" ? "asc" : "desc"};
    render(); return;
  }
  if (t.dataset.asort) {
    const k = t.dataset.asort;
    state.asort = state.asort.key === k
      ? {key:k, dir:state.asort.dir === "asc" ? "desc" : "asc"}
      : {key:k, dir:(k === "name" || k === "pos" || k === "nation" || k === "status") ? "asc" : "desc"};
    render(); return;
  }

  if (t.dataset.season) { state.scope = t.dataset.season; render(); return; }
  if (t.dataset.sort) {
    const k = t.dataset.sort;
    state.sort = state.sort.key === k
      ? {key:k, dir:state.sort.dir === "asc" ? "desc" : "asc"}
      : {key:k, dir:(k === "name" || k === "pos") ? "asc" : "desc"};
    render(); return;
  }
  if (t.id === "btnDelSeason") {
    if (demoOn()) { exitDemo(); render(); return; }
    const s = seasonById(state.scope); if (!s) return;
    if (!await askConfirm("Delete " + s.label + "?", "Its stats and trophies go with it. Players stay in the squad.", "Delete season")) return;
    for (const k of Object.keys(Store.data.stats)) if (Store.data.stats[k].seasonId === s.id) await Store.remove("stats", k);
    for (const k of Object.keys(Store.data.trophies)) if (Store.data.trophies[k].seasonId === s.id) await Store.remove("trophies", k);
    await Store.remove("seasons", s.id);
    state.scope = "all"; render(); return;
  }
  if (t.dataset.leave) {
    if (demoOn()) { exitDemo(); render(); return; }
    return openLeave(t.dataset.leave);
  }
  if (t.dataset.return) {
    if (demoOn()) { exitDemo(); render(); return; }
    const p = Store.data.players[t.dataset.return]; if (!p) return;
    await Store.put("players", p.id, Object.assign({}, p, {departed:false, leftYear:"", leftTo:""}));
    render(); notice(esc(p.name) + " is back in the squad.", "info"); return;
  }
  if (t.dataset.deltrophy) {
    if (demoOn()) { exitDemo(); render(); return; }
    await Store.remove("trophies", t.dataset.deltrophy); render(); return;
  }
});

document.addEventListener("change", async e => {
  const el = e.target;
  if (!el.classList || !el.classList.contains("cell")) return;
  if (demoOn()) { exitDemo(); render(); notice("Example cleared — add your own season and squad.", "info"); return; }
  if (el.dataset.fp) {   /* a contract field on the finances table */
    const p = Store.data.players[el.dataset.fp]; if (!p) return;
    const patch = {}; patch[el.dataset.ff] = el.dataset.ff === "wage" ? Math.round(num(el.value)) : int(el.value);
    if (el.dataset.ff === "imageRights") patch.imageRights = Math.min(100, patch.imageRights);
    await Store.put("players", p.id, Object.assign({}, p, patch));
    render(); return;
  }
  const sid = el.dataset.s || state.scope; if (sid === "all") return;
  const pid = el.dataset.p, f = el.dataset.f, key = statKey(sid, pid);
  const cur = Store.data.stats[key] || {seasonId:sid, playerId:pid, apps:0, goals:0, assists:0, cleanSheets:0, rating:0};
  const body = {seasonId:sid, playerId:pid, apps:int(cur.apps), goals:int(cur.goals), assists:int(cur.assists),
    cleanSheets:int(cur.cleanSheets), rating:num(cur.rating)};
  body[f] = f === "rating" ? Math.min(10, num(el.value)) : int(el.value);
  await Store.put("stats", key, body);
  render();
});
