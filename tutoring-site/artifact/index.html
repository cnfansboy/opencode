<title>Bridgewell Tutoring</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&display=swap"
/>
<style>
  :root {
    --paper: #f7f5f0;
    --card: #fffdfa;
    --sunk: #efebe3;
    --ink: #1c1a18;
    --muted: #6d655a;
    --rule: #e0d9cd;
    --accent: #8a2b32;
    --accent-ink: #fffdfa;
    --accent-wash: #f3e6e4;
    --covered: #2c6a4c;
    --covered-wash: #e4efe6;
    --amber: #92620f;
    --amber-wash: #f7eddb;
    --shadow: 0 1px 1px rgba(40, 30, 20, 0.04), 0 6px 20px rgba(40, 30, 20, 0.05);
    --display: "Newsreader", Georgia, "Times New Roman", serif;
    --body: "Public Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #14151a;
      --card: #1c1e25;
      --sunk: #23262e;
      --ink: #ece7de;
      --muted: #a39a8c;
      --rule: #333741;
      --accent: #e08a90;
      --accent-ink: #1a0e0f;
      --accent-wash: #2e1d1f;
      --covered: #6cc496;
      --covered-wash: #163024;
      --amber: #dcab5c;
      --amber-wash: #2f2716;
      --shadow: 0 1px 1px rgba(0, 0, 0, 0.5), 0 8px 26px rgba(0, 0, 0, 0.35);
    }
  }

  :root[data-theme="dark"] {
    --paper: #14151a;
    --card: #1c1e25;
    --sunk: #23262e;
    --ink: #ece7de;
    --muted: #a39a8c;
    --rule: #333741;
    --accent: #e08a90;
    --accent-ink: #1a0e0f;
    --accent-wash: #2e1d1f;
    --covered: #6cc496;
    --covered-wash: #163024;
    --amber: #dcab5c;
    --amber-wash: #2f2716;
    --shadow: 0 1px 1px rgba(0, 0, 0, 0.5), 0 8px 26px rgba(0, 0, 0, 0.35);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  h1,
  h2,
  h3 {
    font-family: var(--display);
    font-weight: 600;
    line-height: 1.15;
    text-wrap: balance;
    margin: 0;
  }
  h1 {
    font-size: clamp(1.8rem, 4.5vw, 2.5rem);
  }
  h2 {
    font-size: clamp(1.3rem, 3vw, 1.65rem);
  }
  h3 {
    font-size: 1.1rem;
  }
  p {
    margin: 0;
  }
  a {
    color: var(--accent);
  }

  .shell {
    width: min(1060px, 100%);
    margin-inline: auto;
    padding-inline: 16px;
  }

  /* header ------------------------------------------------------------- */
  .masthead {
    background: var(--card);
    border-bottom: 1px solid var(--rule);
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 5;
  }
  .masthead-row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    padding-block: 14px;
  }
  .mark {
    font-family: var(--display);
    font-weight: 600;
    font-size: 1.15rem;
    letter-spacing: -0.01em;
    margin-right: auto;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .crest {
    width: 30px;
    height: 30px;
    display: grid;
    place-items: center;
    border-radius: 4px 4px 14px 14px;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 0.95rem;
    font-weight: 600;
  }
  .viewer {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .viewer img {
    width: 24px;
    height: 24px;
    border-radius: 50%;
  }

  .tabs {
    display: flex;
    gap: 2px;
    overflow-x: auto;
    scrollbar-width: none;
    border-top: 1px solid var(--rule);
  }
  .tabs::-webkit-scrollbar {
    display: none;
  }
  .tab {
    appearance: none;
    background: none;
    border: 0;
    border-bottom: 2px solid transparent;
    color: var(--muted);
    font: 500 0.92rem/1 var(--body);
    padding: 13px 14px;
    cursor: pointer;
    white-space: nowrap;
  }
  .tab:hover {
    color: var(--ink);
  }
  .tab[aria-selected="true"] {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .tab:focus-visible,
  .btn:focus-visible,
  select:focus-visible,
  input:focus-visible,
  textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  main {
    padding-block: 28px 56px;
  }
  .panel-head {
    max-width: 62ch;
    margin-bottom: 24px;
    display: grid;
    gap: 8px;
  }
  .panel-head p {
    color: var(--muted);
  }
  section + section {
    margin-top: 32px;
  }

  /* shared bits --------------------------------------------------------- */
  .chip {
    font: 500 0.72rem/1.5 var(--body);
    letter-spacing: 0.02em;
    padding: 2px 8px;
    border-radius: 3px;
    background: var(--sunk);
    color: var(--muted);
    white-space: nowrap;
  }
  .chip.stage {
    background: var(--accent-wash);
    color: var(--accent);
  }
  .chip.good {
    background: var(--covered-wash);
    color: var(--covered);
  }
  .chip.warn {
    background: var(--amber-wash);
    color: var(--amber);
  }
  .meta {
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .rowline {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn {
    appearance: none;
    font: 600 0.87rem/1 var(--body);
    padding: 9px 14px;
    border-radius: 4px;
    border: 1px solid var(--rule);
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
  }
  .btn:hover:not(:disabled) {
    border-color: var(--accent);
    color: var(--accent);
  }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }
  .btn.primary:hover:not(:disabled) {
    color: var(--accent-ink);
    opacity: 0.9;
  }
  .btn.tiny {
    padding: 6px 10px;
    font-size: 0.78rem;
  }
  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  select,
  input,
  textarea {
    font: 400 0.92rem/1.4 var(--body);
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 9px 10px;
    width: 100%;
    max-width: 100%;
  }
  textarea {
    min-height: 96px;
    resize: vertical;
  }
  label {
    display: block;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 5px;
  }
  .field-row {
    display: grid;
    gap: 14px;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  }
  .note {
    background: var(--sunk);
    border-left: 2px solid var(--rule);
    padding: 10px 14px;
    color: var(--muted);
    font-size: 0.87rem;
    border-radius: 0 4px 4px 0;
  }
  .empty {
    border: 1px dashed var(--rule);
    border-radius: 6px;
    padding: 28px;
    text-align: center;
    color: var(--muted);
  }
</style>
<style>
  /* courses ------------------------------------------------------------ */
  .filters {
    display: grid;
    gap: 14px;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    padding: 16px;
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 6px;
    margin-bottom: 20px;
  }
  .course-list {
    display: grid;
    gap: 14px;
  }
  .course {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 6px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .course > summary {
    list-style: none;
    cursor: pointer;
    padding: 18px;
    display: grid;
    gap: 6px;
  }
  .course > summary::-webkit-details-marker {
    display: none;
  }
  .course-title {
    display: flex;
    gap: 10px;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
  }
  .course-title h3 {
    font-size: 1.22rem;
  }
  .course-title h3::after,
  .tracker-head h3::after {
    content: " ▸";
    color: var(--accent);
    font-family: var(--body);
    font-size: 0.8rem;
    display: inline-block;
    transition: transform 0.18s ease;
  }
  details[open] > summary .course-title h3::after,
  details[open] > summary .tracker-head h3::after {
    transform: rotate(90deg);
  }
  .course-body {
    padding: 0 18px 18px;
    display: grid;
    gap: 14px;
    border-top: 1px solid var(--rule);
    padding-top: 16px;
  }
  .topic-grid {
    display: grid;
    gap: 6px 18px;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    font-size: 0.88rem;
    counter-reset: topic;
  }
  .topic-grid li {
    list-style: none;
    color: var(--muted);
    display: flex;
    gap: 8px;
  }
  .topic-grid li::before {
    counter-increment: topic;
    content: counter(topic);
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--accent);
    min-width: 1.2em;
  }
  ul.topic-grid {
    margin: 0;
    padding: 0;
  }

  /* timetable ----------------------------------------------------------- */
  .timetable {
    display: grid;
    gap: 0;
  }
  .slot {
    display: grid;
    grid-template-columns: 74px 1fr;
    gap: 18px;
    padding-bottom: 18px;
  }
  .slot-time {
    font-family: var(--mono);
    font-size: 0.92rem;
    font-weight: 500;
    padding-top: 16px;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .slot-classes {
    display: grid;
    gap: 12px;
    border-left: 1px solid var(--rule);
    padding-left: 18px;
  }
  .class {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 16px;
    display: grid;
    gap: 8px;
    box-shadow: var(--shadow);
    position: relative;
  }
  .class.booked {
    border-color: var(--covered);
  }
  .class-head {
    display: flex;
    gap: 10px;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
  }
  .class p.desc {
    color: var(--muted);
    font-size: 0.9rem;
    max-width: 60ch;
  }
  .class-foot {
    display: flex;
    gap: 12px;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    border-top: 1px dashed var(--rule);
    padding-top: 10px;
  }
  .seats {
    display: flex;
    gap: 3px;
    align-items: center;
  }
  .seat {
    width: 9px;
    height: 9px;
    border-radius: 2px;
    background: var(--covered);
  }
  .seat.taken {
    background: var(--rule);
  }

  /* reviews -------------------------------------------------------------- */
  .review-grid {
    display: grid;
    gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  }
  .review {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 16px;
    display: grid;
    gap: 7px;
    align-content: start;
  }
  .stars {
    color: var(--accent);
    letter-spacing: 2px;
    font-size: 0.95rem;
  }
  .review h3 {
    font-size: 1.05rem;
  }
  .review p.text {
    color: var(--muted);
    font-size: 0.92rem;
  }
  .score {
    display: flex;
    align-items: baseline;
    gap: 10px;
    font-family: var(--display);
  }
  .score strong {
    font-size: 2.6rem;
    font-weight: 500;
    line-height: 1;
  }
  .form-card {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 18px;
    display: grid;
    gap: 14px;
    max-width: 560px;
  }

  /* progress -------------------------------------------------------------- */
  .tracker {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 6px;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .tracker > summary {
    list-style: none;
    cursor: pointer;
    padding: 16px 18px;
    display: grid;
    gap: 10px;
  }
  .tracker > summary::-webkit-details-marker {
    display: none;
  }
  .tracker-head {
    display: flex;
    gap: 10px;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
  }
  .bar {
    height: 6px;
    border-radius: 3px;
    background: var(--sunk);
    overflow: hidden;
  }
  .bar > span {
    display: block;
    height: 100%;
    background: var(--covered);
  }
  .topics {
    margin: 0;
    padding: 0 18px 18px;
    display: grid;
    gap: 4px;
    list-style: none;
  }
  .topic {
    display: grid;
    grid-template-columns: 22px 1fr auto;
    gap: 10px;
    align-items: center;
    padding: 9px 10px;
    border-radius: 4px;
    background: var(--sunk);
    font-size: 0.92rem;
  }
  .topic.covered,
  .topic.secure {
    background: var(--covered-wash);
  }
  .topic .tick {
    font-family: var(--mono);
    color: var(--muted);
    text-align: center;
  }
  .topic.covered .tick,
  .topic.secure .tick {
    color: var(--covered);
  }
  .topic .when {
    grid-column: 2 / -1;
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--muted);
  }
  .setters {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }
  .setters .btn.on {
    background: var(--muted);
    border-color: var(--muted);
    color: var(--card);
  }
  .setters .btn.on[data-status="covered"],
  .setters .btn.on[data-status="secure"] {
    background: var(--covered);
    border-color: var(--covered);
    color: #fff;
  }
  .student-row {
    display: flex;
    gap: 14px;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .student-row .who {
    display: grid;
    gap: 2px;
  }
  .student-row .name {
    font-weight: 600;
  }

  footer.foot {
    border-top: 1px solid var(--rule);
    padding-block: 22px 32px;
    color: var(--muted);
    font-size: 0.84rem;
    display: grid;
    gap: 4px;
  }

  #flash {
    position: fixed;
    left: 50%;
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    transform: translate(-50%, 150%);
    background: var(--ink);
    color: var(--paper);
    padding: 9px 18px;
    border-radius: 999px;
    font-size: 0.87rem;
    font-weight: 600;
    transition: transform 0.24s ease;
    z-index: 20;
    max-width: calc(100% - 32px);
    text-align: center;
  }
  #flash.show {
    transform: translate(-50%, 0);
  }
  #flash:empty {
    display: none;
  }

  /* sign in + dashboards ------------------------------------------------- */
  .auth {
    display: grid;
    grid-template-columns: 1.05fr 1fr;
    border: 1px solid var(--rule);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .auth-brand {
    background: linear-gradient(155deg, #3a1216, #6d2229 75%);
    color: #f7ece9;
    padding: clamp(22px, 4vw, 38px);
    display: grid;
    align-content: center;
    gap: 12px;
  }
  .auth-eyebrow {
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-size: 0.7rem;
    font-weight: 700;
    color: #e2a7a4;
  }
  .auth-brand h2 {
    color: #fff;
    font-size: clamp(1.5rem, 3vw, 2rem);
  }
  .auth-brand p {
    color: #e8d3d0;
    font-size: 0.94rem;
  }
  .auth-points {
    list-style: none;
    margin: 6px 0 0;
    padding: 0;
    display: grid;
    gap: 9px;
  }
  .auth-points li {
    display: flex;
    gap: 9px;
    font-size: 0.9rem;
  }
  .auth-points li::before {
    content: "✓";
    color: #8fd9b4;
    font-weight: 700;
  }
  .auth-card {
    background: var(--card);
    padding: clamp(22px, 4vw, 34px);
    display: grid;
    gap: 14px;
    align-content: start;
  }
  .role-picker {
    display: grid;
    gap: 10px;
  }
  .role {
    text-align: left;
    display: grid;
    gap: 3px;
    padding: 14px 16px;
    border: 1px solid var(--rule);
    border-radius: 8px;
    background: var(--sunk);
    cursor: pointer;
    font: inherit;
    color: var(--ink);
  }
  .role:hover {
    border-color: var(--accent);
    background: var(--accent-wash);
  }
  .role strong {
    font-size: 1rem;
  }
  .role .muted {
    color: var(--muted);
    font-size: 0.86rem;
  }
  .role-icon {
    font-family: var(--mono);
    color: var(--accent);
    font-weight: 700;
  }
  @media (max-width: 720px) {
    .auth {
      grid-template-columns: 1fr;
    }
  }

  .dash-head {
    display: flex;
    gap: 14px;
    align-items: flex-end;
    justify-content: space-between;
    flex-wrap: wrap;
    margin-bottom: 22px;
  }
  .dash-head h1 {
    margin: 0 0 3px;
  }
  .eyebrow {
    text-transform: uppercase;
    letter-spacing: 0.09em;
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--accent);
  }
  .tiles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 34px;
  }
  .tile {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 14px 16px;
    display: grid;
    gap: 1px;
    align-content: start;
  }
  .tile-label {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
  }
  .tile strong {
    font-family: var(--display);
    font-size: 1.9rem;
    line-height: 1.1;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .tile strong.small-figure {
    font-family: var(--mono);
    font-size: 1.25rem;
  }
  .tile .of {
    font-size: 0.95rem;
    color: var(--muted);
  }
  .tile .muted {
    color: var(--muted);
    font-size: 0.8rem;
  }

  .ring {
    width: 58px;
    height: 58px;
    flex: 0 0 58px;
  }
  .ring-track {
    fill: none;
    stroke: var(--sunk);
    stroke-width: 7;
  }
  .ring-value {
    fill: none;
    stroke-width: 7;
    stroke-linecap: round;
    transform: rotate(-90deg);
    transform-origin: 50% 50%;
    transition: stroke-dashoffset 0.4s ease;
  }
  .ring-text {
    font-size: 15px;
    font-weight: 700;
    text-anchor: middle;
    fill: var(--ink);
    font-family: var(--body);
  }
  .s-maths .ring-value {
    stroke: #3f6fae;
  }
  .s-science .ring-value {
    stroke: var(--covered);
  }

  .dash-grid {
    display: grid;
    gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
  }
  .dash-card {
    background: var(--card);
    border: 1px solid var(--rule);
    border-top-width: 3px;
    border-radius: 8px;
    padding: 16px;
    display: grid;
    gap: 10px;
    align-content: start;
    box-shadow: var(--shadow);
  }
  .dash-card.s-maths {
    border-top-color: #3f6fae;
  }
  .dash-card.s-science {
    border-top-color: var(--covered);
  }
  .dash-card-top {
    display: flex;
    gap: 13px;
    align-items: center;
  }
  .dash-card h3 {
    font-size: 1.02rem;
  }
  .dash-card .tracker {
    margin: 0;
  }

  .student-card {
    display: flex;
    gap: 15px;
    align-items: center;
    flex-wrap: wrap;
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 8px;

<script>
  const CATALOGUE = {"courses":[{"slug":"ks2-maths-foundations","title":"KS2 Maths Foundations","subject":"Maths","stage":"ks2","summary":"Number confidence, times tables and problem solving for Years 3-6.","description":"Small-group and one-to-one sessions that rebuild number confidence from the ground up. We work through the KS2 national curriculum at the pace the child needs, with plenty of practical apparatus and low-stakes practice.","price":2800,"length":"45 minutes, weekly","boards":"National curriculum","topics":["Place value to 1,000,000","Addition and subtraction (column method)","Times tables to 12x12","Short and long multiplication","Short and long division","Fractions: equivalence and simplifying","Adding and subtracting fractions","Decimals and percentages","Measurement: length, mass and capacity","Perimeter, area and volume","Angles and 2D shape properties","Reading and drawing charts","Multi-step word problems"]},{"slug":"ks3-maths-bridge","title":"KS3 Maths (Years 7-9)","subject":"Maths","stage":"ks3","summary":"Bridging primary arithmetic into algebra, ratio and geometry.","description":"The KS3 years are where gaps quietly open up before GCSE. This course covers the full Year 7-9 programme of study, with diagnostic checks each half term so we can go back over anything that has not stuck.","price":3200,"length":"1 hour, weekly","boards":"National curriculum","topics":["Negative numbers and order of operations","Prime factors, HCF and LCM","Introduction to algebraic notation","Solving linear equations","Expanding and factorising","Sequences and the nth term","Ratio and proportion","Percentages: increase, decrease and reverse","Straight line graphs","Angles in parallel lines and polygons","Transformations","Averages and data handling","Probability basics"]},{"slug":"ks3-science","title":"KS3 Science (Years 7-9)","subject":"Science","stage":"ks3","summary":"Biology, chemistry and physics fundamentals with practical investigation skills.","description":"A single course covering all three sciences at KS3, with an emphasis on working scientifically: variables, fair tests, graphs and conclusions. Ideal preparation for setting decisions at the end of Year 9.","price":3200,"length":"1 hour, weekly","boards":"National curriculum","topics":["Cells and organisation","Body systems: digestion and circulation","Reproduction and inheritance","Photosynthesis and ecosystems","Particle model and states of matter","Atoms, elements and compounds","Chemical reactions and word equations","Acids and alkalis","Forces and motion","Energy stores and transfers","Electricity and circuits","Light and sound waves","Working scientifically: variables and graphs"]},{"slug":"gcse-combined-science","title":"GCSE Combined Science (Trilogy)","subject":"Science","stage":"gcse","summary":"Biology, chemistry and physics content plus the required practicals.","description":"Covers the combined science specification including all required practicals and the maths skills that appear in the papers. We rotate across the three sciences so nothing is left until the last term.","price":3800,"length":"1 hour, weekly","boards":"AQA · Edexcel · OCR Gateway","topics":["Cell biology and transport","Infection and response","Bioenergetics","Homeostasis and the nervous system","Inheritance, variation and evolution","Atomic structure and the periodic table","Bonding, structure and properties","Quantitative chemistry","Chemical and energy changes","Rates of reaction and organic chemistry","Energy and efficiency","Electricity","Particle model and atomic structure","Forces and motion","Waves and electromagnetism","Required practicals and working scientifically"]},{"slug":"gcse-maths-higher","title":"GCSE Maths (Higher Tier)","subject":"Maths","stage":"gcse","summary":"Full Higher tier coverage with exam technique for grades 6-9.","description":"Complete Higher tier coverage across all exam boards, including the topics that decide grades 7-9: surds, algebraic fractions, circle theorems, vectors and iterative methods. Past paper questions every session.","price":3800,"length":"1 hour, weekly","boards":"AQA · Edexcel · OCR","topics":["Surds and indices","Algebraic fractions","Quadratics: factorising, formula, completing the square","Simultaneous equations (linear and quadratic)","Inequalities and regions","Functions and inverse functions","Iteration and numerical methods","Circle theorems","Trigonometry: SOHCAHTOA","Sine and cosine rules","Vectors and geometric proof","Similarity and congruence","Histograms and cumulative frequency","Probability trees and conditional probability","Direct and inverse proportion","Transformations of graphs"]},{"slug":"alevel-maths","title":"A Level Maths","subject":"Maths","stage":"alevel","summary":"Pure, statistics and mechanics across Years 12 and 13.","description":"Year 12 and Year 13 content taught alongside school, with a focus on the proof and modelling skills that students find hardest in the transition from GCSE. Includes support for the large data set.","price":4500,"length":"1 hour, weekly","boards":"AQA · Edexcel · OCR · MEI","topics":["Proof: deduction, exhaustion and counter-example","Algebraic methods and partial fractions","Binomial expansion","Coordinate geometry and circles","Trigonometric identities and equations","Differentiation from first principles","Chain, product and quotient rules","Integration and areas under curves","Integration by parts and substitution","Exponentials and logarithms","Parametric equations","Numerical methods","Vectors in 2D and 3D","Statistical sampling and the large data set","Probability distributions (binomial and normal)","Hypothesis testing","Kinematics and constant acceleration","Newton's laws and connected particles","Moments"]}],"stages":[{"id":"ks2","label":"KS2 (Primary, Years 3-6)","short":"KS2","order":1},{"id":"ks3","label":"KS3 (Secondary, Years 7-9)","short":"KS3","order":2},{"id":"gcse","label":"GCSE (Years 10-11)","short":"GCSE","order":3},{"id":"alevel","label":"A Level (Years 12-13)","short":"A Level","order":4}]}
  const STAGES = [
    { id: "ks2", label: "KS2 (Primary, Years 3-6)", short: "KS2" },
    { id: "ks3", label: "KS3 (Secondary, Years 7-9)", short: "KS3" },
    { id: "gcse", label: "GCSE (Years 10-11)", short: "GCSE" },
    { id: "alevel", label: "A Level (Years 12-13)", short: "A Level" },
  ]
  const STATUS = { not_started: "Not covered yet", covered: "Covered", secure: "Secure" }
  const STAGE_RANK = { ks2: 1, ks3: 2, gcse: 3, alevel: 4 }

  const state = {
    tab: "subjects",
    db: null,
    user: null,
    uid: null,
    me: null,
    writable: null,
    students: new Map(),
    slots: new Map(),
    reviews: [],
    profiles: {},
    filters: { stage: "", subject: "", q: "" },
    openStudent: null,
    openCourse: null,
    shared: false,
    account: null,
    accounts: new Map(),
    email: "",
    site: { name: "Bridgewell Tutoring" },
  }

  const SIGNED_OUT = "bridgewell:signed-out"
  const readSignedOut = () => {
    try {
      return localStorage.getItem(SIGNED_OUT) === "1"
    } catch {
      return false
    }
  }
  const writeSignedOut = (value) => {
    try {
      value ? localStorage.setItem(SIGNED_OUT, "1") : localStorage.removeItem(SIGNED_OUT)
    } catch {}
  }

  const esc = (value) =>
    String(value ?? "").replace(
      /[&<>"']/g,
      (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
    )
  const money = (pence) => "£" + Math.round(pence / 100)
  const stageLabel = (id) => (STAGES.find((s) => s.id === id) || {}).label || id
  const stars = (n) => "★".repeat(Math.round(n)) + "☆".repeat(5 - Math.round(n))
  const key = (slug, index) => slug + ":" + index
  const when = (iso) => {
    if (!iso) return ""
    const d = new Date(iso)
    return isNaN(d) ? "" : d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" })
  }

  let flashTimer
  function flash(message) {
    const node = document.getElementById("flash")
    node.textContent = message
    node.classList.add("show")
    clearTimeout(flashTimer)
    flashTimer = setTimeout(() => node.classList.remove("show"), 3000)
  }

  const subjects = [...new Set(CATALOGUE.courses.map((c) => c.subject))].sort()
  const courseBySlug = (slug) => CATALOGUE.courses.find((c) => c.slug === slug)
  const sortedCourses = [...CATALOGUE.courses].sort(
    (a, b) => STAGE_RANK[a.stage] - STAGE_RANK[b.stage] || a.title.localeCompare(b.title),
  )

  const myDoc = () => (state.uid && state.students.get(state.uid)) || null
  const myCourses = () => (myDoc() || {}).courses || []
  const mySlots = () => ((state.uid && state.slots.get(state.uid)) || {}).slots || []
  const nameFor = (id, doc) => (doc && doc.demoName) || (state.profiles[id] || {}).name || "A student"

  function counts(doc, slug) {
    const course = courseBySlug(slug)
    if (!course) return { total: 0, covered: 0, secure: 0, percent: 0 }
    const progress = (doc && doc.progress) || {}
    const rows = course.topics.map((_, index) => (progress[key(slug, index)] || {}).status || "not_started")
    const covered = rows.filter((s) => s !== "not_started").length
    return {
      total: rows.length,
      covered,
      secure: rows.filter((s) => s === "secure").length,
      percent: rows.length ? Math.round((covered / rows.length) * 100) : 0,
    }
  }

  /* ---- writes ---------------------------------------------------------- */

  function needsAccount() {
    if (state.uid) return false
    flash("Open this page signed in to save changes.")
    return true
  }

  async function saveStudent(patch) {
    if (needsAccount()) return
    const current = state.students.get(state.uid) || { stage: "", courses: [], progress: {} }
    const next = Object.assign({}, current, patch)
    state.students.set(state.uid, next)
    render()
    await write(() => state.db.doc("students/" + state.uid).set(next))
  }

  async function setStatus(studentId, topicKey, status, note) {
    const doc = state.students.get(studentId)
    if (!doc) return
    const progress = Object.assign({}, doc.progress || {})
    const previous = progress[topicKey] || {}
    progress[topicKey] = {
      status,
      note: note === undefined ? previous.note || "" : note,
      by: state.uid || "tutor",
      at: new Date().toISOString(),
    }
    const next = Object.assign({}, doc, { progress })
    state.students.set(studentId, next)
    render()
    await write(() => state.db.doc("students/" + studentId).set(next))
  }

  async function publishSlot(slot) {
    if (needsAccount()) return
    const time = /^([01]\d|2[0-3]):[0-5]\d$/
    if (!time.test(slot.starts) || !time.test(slot.ends)) return flash("Times must look like 16:00.")
    if (slot.ends <= slot.starts) return flash("The finish time must be after the start time.")

    const subjects = ["Any"].concat([...new Set(CATALOGUE.courses.map((c) => c.subject))])
    if (!subjects.includes(slot.subject)) return flash("Choose a subject these hours are for.")

    const mine = mySlots()
    const clash = mine.find((item) => item.weekday === slot.weekday && item.starts < slot.ends && item.ends > slot.starts)
    if (clash) return flash(`That overlaps the ${clash.starts}–${clash.ends} you already published.`)

    const next = { slots: mine.concat(slot).sort((a, b) => a.weekday - b.weekday || a.starts.localeCompare(b.starts)) }
    state.slots.set(state.uid, Object.assign({}, state.slots.get(state.uid), next))
    render()
    flash("Hours published")
    await write(() => state.db.doc("availability/" + state.uid).set(state.slots.get(state.uid)))
  }

  async function removeSlot(index) {
    if (needsAccount()) return
    const next = { slots: mySlots().filter((_, i) => i !== index) }
    state.slots.set(state.uid, Object.assign({}, state.slots.get(state.uid), next))
    render()
    flash("Slot removed")
    await write(() => state.db.doc("availability/" + state.uid).set(state.slots.get(state.uid)))
  }

  async function addReview(review) {
    const row = {
      by: state.uid || null,
      rating: review.rating,
      title: review.title,
      body: review.body,
      course: review.course || "",
      at: new Date().toISOString(),
    }
    if (!state.db) {
      state.reviews = [Object.assign({ id: "local-" + Date.now(), demoName: "You" }, row)].concat(state.reviews)
      render()
      flash("Review added (this view only — it is not shared)")
      return
    }
    await write(() => state.db.collection("reviews").add(row), "Thank you — your review is published")
  }

  async function chooseRole(role, email) {
    if (!state.uid) return flash("This page could not identify your account.")

    const address = String(email || "").trim()
    if (!address) return flash("An email address is required to create an account.")
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(address)) return flash("Please enter a valid email address.")
    if (role === "tutor" && tutorTaken()) return flash(`${tutorHolder()} already holds the tutor account.`)

    state.email = address
    state.account = { role, at: new Date().toISOString() }
    state.accounts.set(state.uid, state.account)
    writeSignedOut(false)
    if (role === "student" && !state.students.get(state.uid))
      state.students.set(state.uid, { stage: "", courses: [], progress: {} })
    render()
    flash(role === "tutor" ? "Signed in as a tutor" : "Signed in as a student")
    await write(() => state.db.doc("accounts/" + state.uid).set(state.account))
    // The address itself stays in the viewer's own private subtree.
    await write(() => state.db.doc("data/users/" + state.uid + "/profile").set({ email: address }))
    if (role === "student") await write(() => state.db.doc("students/" + state.uid).set(state.students.get(state.uid)))
  }

  async function renameSite(name) {
    state.site = { name }
    applySite()
    render()
    await write(() => state.db.doc("settings/site").set({ name }), "Website name updated")
  }

  async function write(run, message) {
    if (!state.db) return
    try {
      await run()
      if (message) flash(message)
    } catch (error) {
      if (error && error.code === "invalid_argument") {
        state.writable = false
        render()
        flash("You have view-only access, so that change was not saved.")
        return
      }
      flash("That did not save. Please try again.")
    }
  }

  /* ---- panels ---------------------------------------------------------- */

  const levelShort = (stage) => (CATALOGUE.stages.find((s) => s.id === stage) || {}).short || stage
  const WEEKDAYS = [
    { id: 0, label: "Monday", short: "Mon" },
    { id: 1, label: "Tuesday", short: "Tue" },
    { id: 2, label: "Wednesday", short: "Wed" },
    { id: 3, label: "Thursday", short: "Thu" },
    { id: 4, label: "Friday", short: "Fri" },
    { id: 5, label: "Saturday", short: "Sat" },
    { id: 6, label: "Sunday", short: "Sun" },
  ]

  const slotList = () =>
    [...state.slots.entries()]
      .flatMap(([id, doc]) => (doc.slots || []).map((slot, index) => ({ ...slot, owner: id, key: id + ":" + index })))
      .sort((a, b) => a.weekday - b.weekday || a.starts.localeCompare(b.starts))

  // One person tutors here: name whoever has released hours.
  const tutorName = () => {
    const owner = [...state.slots.entries()].find(([, doc]) => (doc.slots || []).length)
    return (owner && nameFor(owner[0], owner[1])) || "your tutor"
  }

  function slotRows(subject) {
    return slotList().filter((slot) => slot.subject === subject || slot.subject === "Any")
  }

  function renderSubjects() {
    const mine = myCourses()
    const groups = [...new Set(CATALOGUE.courses.map((c) => c.subject))]
      .sort()
      .map((subject) => ({
        subject,
        courses: CATALOGUE.courses
          .filter((c) => c.subject === subject)
          .sort((a, b) => STAGE_RANK[a.stage] - STAGE_RANK[b.stage]),
        slots: slotRows(subject),
      }))

    return `
      <div class="panel-head">
        <h1>Subjects</h1>
        <p>Open a subject to see the levels it runs to and the time slots ${esc(tutorName())} has released for it.</p>
      </div>

      ${groups
        .map(
          (group, index) => `<details class="subject-block ${subjectClass(group.subject)}" ${index === 0 ? "open" : ""}>
            <summary>
              <div class="subject-head">
                <h2>${esc(group.subject)}</h2>
                <div class="rowline level-chips">
                  ${group.courses.map((course) => `<span class="chip level">${esc(levelShort(course.stage))}</span>`).join("")}
                  <span class="chip slots-count">${group.slots.length} slot${group.slots.length === 1 ? "" : "s"} free</span>
                </div>
              </div>
            </summary>

            <div class="subject-body">
              <h3 class="section-label">Levels</h3>
              <div class="levels">
                ${group.courses
                  .map((course) => {
                    const held = mine.includes(course.slug)
                    return `<details class="level-card">
                      <summary>
                        <span class="level-name"><strong>${esc(levelShort(course.stage))}</strong>
                          <span class="muted">${esc(course.title)}</span></span>
                        <span class="meta">${course.topics.length} topics · ${money(course.price)}</span>
                      </summary>
                      <div class="level-body">
                        <p style="font-size:0.92rem">${esc(course.description)}</p>
                        <p class="meta">${esc(course.length)} · ${esc(course.boards)}</p>
                        <ul class="topic-grid">${course.topics.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>
                        ${
                          state.account && state.account.role === "student"
                            ? `<div><button class="btn ${held ? "" : "primary"}" data-course-toggle="${esc(course.slug)}">
                                ${held ? "Remove from my plan" : "Add to my plan"}
                              </button></div>`
                            : `<p class="meta">Sign in as a student on the Dashboard tab to add this level to your plan.</p>`
                        }
                      </div>
                    </details>`
                  })
                  .join("")}
              </div>

              <h3 class="section-label">Time slots released for ${esc(group.subject)}</h3>
              ${
                group.slots.length
                  ? `<ul class="slot-list">${group.slots
                      .map(
                        (slot) => `<li class="slot-row">
                          <span class="slot-day">${WEEKDAYS[slot.weekday].label}</span>
                          <span class="slot-time">${esc(slot.starts)}–${esc(slot.ends)}</span>
                          <span class="slot-detail">
                            ${slot.subject === "Any" ? `<span class="chip">Any subject</span>` : ""}
                            ${slot.note ? esc(slot.note) : ""}
                          </span>
                        </li>`,
                      )
                      .join("")}</ul>
                     <p class="meta">Sessions run with ${esc(tutorName())}. Get in touch to take one of these slots.</p>`
                  : `<div class="empty">No slots released for ${esc(group.subject)} yet.</div>`
              }
            </div>
          </details>`,
        )
        .join("")}`
  }

  function renderReviews() {
    const average = state.reviews.length
      ? (state.reviews.reduce((sum, r) => sum + Number(r.rating || 0), 0) / state.reviews.length).toFixed(1)
      : null
    return `
      <div class="panel-head">
        <h1>Reviews</h1>
        <p>Written by the families and students we work with. Anyone using this page can add one.</p>
      </div>
      ${
        average
          ? `<div class="score" style="margin-bottom:20px"><strong>${average}</strong>
              <span><span class="stars">${stars(average)}</span><br /><span class="meta">${state.reviews.length} review${state.reviews.length === 1 ? "" : "s"}</span></span></div>`
          : ""
      }
      <section>
        <form class="form-card" id="review-form">
          <h2>Leave a review</h2>
          <div class="field-row">
            <div>
              <label for="r-course">Course</label>
              <select id="r-course">
                <option value="">Overall experience</option>
                ${sortedCourses.map((c) => `<option value="${esc(c.slug)}">${esc(c.title)}</option>`).join("")}
              </select>
            </div>
            <div>
              <label for="r-rating">Rating</label>
              <select id="r-rating">${[5, 4, 3, 2, 1].map((n) => `<option value="${n}">${stars(n)} (${n})</option>`).join("")}</select>
            </div>
          </div>
          <div>
            <label for="r-title">Title</label>
            <input id="r-title" placeholder="Sum it up in a few words" required />
          </div>
          <div>
            <label for="r-body">Your review</label>
            <textarea id="r-body" placeholder="What went well? What would you tell another family?" required></textarea>
          </div>
          <div class="rowline">
            <button class="btn primary" type="submit">Publish review</button>
            <span class="meta">${state.uid ? "Posting as " + esc((state.me && state.me.name) || "you") : "Sign in to post"}</span>
          </div>
        </form>
      </section>
      <section>
        <h2 style="margin-bottom:14px">What families say</h2>
        ${
          state.reviews.length
            ? `<div class="review-grid">${state.reviews
                .map(
                  (review) => `<article class="review">
                    <span class="stars" aria-label="${esc(review.rating)} out of 5">${stars(review.rating)}</span>
                    <h3>${esc(review.title)}</h3>
                    <p class="text">${esc(review.body)}</p>
                    <p class="meta">
                      ${esc(review.demoName || nameFor(review.by, null))}${review.course ? " · " + esc((courseBySlug(review.course) || {}).title || review.course) : ""}${review.at ? " · " + esc(when(review.at)) : ""}
                    </p>
                  </article>`,
                )
                .join("")}</div>`
            : `<div class="empty">No reviews yet — yours would be the first.</div>`
        }
      </section>`
  }

  function trackerMarkup(doc, slug, editable) {
    const course = courseBySlug(slug)
    if (!course) return ""
    const progress = (doc && doc.progress) || {}
    const c = counts(doc, slug)
    return `<details class="tracker" ${editable ? "open" : ""}>
      <summary>
        <div class="tracker-head">
          <h3>${esc(course.title)} <span class="chip stage">${esc(stageLabel(course.stage))}</span></h3>
          <span class="meta">${c.covered}/${c.total} covered · ${c.percent}%</span>
        </div>
        <div class="bar"><span style="width:${c.percent}%"></span></div>
      </summary>
      <ul class="topics">
        ${course.topics
          .map((title, index) => {
            const k = key(slug, index)
            const row = progress[k] || {}
            const status = row.status || "not_started"
            return `<li class="topic ${status}">
              <span class="tick" aria-hidden="true">${status === "not_started" ? "○" : status === "secure" ? "✔✔" : "✔"}</span>
              <span>${esc(title)}</span>
              ${
                editable
                  ? `<span class="setters">
                      ${["not_started", "covered", "secure"]
                        .map(
                          (option) =>
                            `<button class="btn tiny ${status === option ? "on" : ""}" data-status="${option}" data-topic="${esc(k)}">${STATUS[option]}</button>`,
                        )
                        .join("")}
                    </span>`
                  : `<span class="chip ${status === "not_started" ? "" : "good"}">${STATUS[status]}</span>`
              }
              ${
                editable
                  ? `<input class="topic-note" data-note="${esc(k)}" value="${esc(row.note || "")}" placeholder="Session note — press Enter to save" />`
                  : row.at || row.note
                    ? `<span class="when">${row.at ? "Ticked " + esc(when(row.at)) : ""}${row.note ? " · " + esc(row.note) : ""}</span>`
                    : ""
              }
            </li>`
          })
          .join("")}
      </ul>
    </details>`
  }

  const GREETING = () => {
    const hour = new Date().getHours()
    return hour < 12 ? "Good morning" : hour < 18 ? "Good afternoon" : "Good evening"
  }

  const subjectClass = (subject) => (subject === "Maths" ? "s-maths" : "s-science")

  function ring(percent, subject) {
    const circumference = 2 * Math.PI * 26
    return `<svg class="ring ${subjectClass(subject)}" viewBox="0 0 64 64" role="img" aria-label="${percent}% covered">
      <circle class="ring-track" cx="32" cy="32" r="26" />
      <circle class="ring-value" cx="32" cy="32" r="26" stroke-dasharray="${circumference}"
        stroke-dashoffset="${circumference * (1 - percent / 100)}" />
      <text x="32" y="33" class="ring-text">${percent}%</text>
    </svg>`
  }

  const tutorAccount = () => [...state.accounts.entries()].find(([, doc]) => doc && doc.role === "tutor")
  const tutorTaken = () => {
    const held = tutorAccount()
    return !!held && held[0] !== state.uid
  }
  const tutorHolder = () => {
    const held = tutorAccount()
    return held ? nameFor(held[0], state.students.get(held[0]) || state.slots.get(held[0])) : "Someone"
  }

  function renderSignIn() {
    const name = (state.me && state.me.name) || ""
    return `
      <div class="auth">
        <aside class="auth-brand">
          <p class="auth-eyebrow">${esc(state.site.name)}</p>
          <h2>Every topic, tracked.</h2>
          <p>Maths from KS2 to A Level and science up to GCSE, taught weekly and ticked off topic by topic so you always know where you are.</p>
          <ul class="auth-points">
            <li>See exactly what your tutor has covered</li>
            <li>Follow the AQA, Edexcel or OCR specification</li>
            <li>Book a Saturday class at the centre</li>
          </ul>
        </aside>
        <div class="auth-card">
          <h2>Sign in</h2>
          ${
            state.uid
              ? `<p class="muted" style="font-size:0.92rem">
                   You are signed in as <strong>${esc(name || "your account")}</strong>. Choose how you use
                   ${esc(state.site.name)} and your dashboard is built for that role.
                 </p>
                 <form id="signin-form">
                   <div>
                     <label for="account-email">Email address (required)</label>
                     <input id="account-email" type="email" required autocomplete="email"
                       value="${esc(state.email || (state.me && state.me.email) || "")}"
                       placeholder="you@example.com" />
                     <p class="muted" style="font-size:0.8rem;margin-top:5px">
                       Every account needs one. Yours is stored privately — no other viewer of this page can read it.
                     </p>
                   </div>
                   <div class="role-picker">
                     <button class="role" type="submit" data-role="student">
                       <span class="role-icon" aria-hidden="true">✎</span>
                       <strong>I'm a student or parent</strong>
                       <span class="muted">Pick your courses, set your stage and follow the topics your tutor has covered.</span>
                     </button>
                     ${
                       tutorTaken()
                         ? `<div class="role role-taken">
                             <span class="role-icon" aria-hidden="true">✓</span>
                             <strong>The tutor account is taken</strong>
                             <span class="muted">${esc(tutorHolder())} already holds it. Only one person tutors here.</span>
                           </div>`
                         : `<button class="role" type="submit" data-role="tutor">
                             <span class="role-icon" aria-hidden="true">✓</span>
                             <strong>I'm the tutor</strong>
                             <span class="muted">See every student, tick off the topics you cover and leave session notes.</span>
                           </button>`
                     }
                   </div>
                 </form>
                 <p class="muted" style="font-size:0.8rem">
                   The deployed site signs in with an email and password. Here your claude.ai account is the sign-in,
                   so there is no password to keep.
                 </p>`
              : `<p class="muted">This page could not identify your account, so there is nothing to sign in to. The
                   catalogue, the timetable and the reviews all still work.</p>`
          }
        </div>
      </div>`
  }

  function renderDashboard() {
    if (!state.account || !state.account.role) return renderSignIn()
    if (state.account.role === "tutor") return state.openStudent ? renderTracker() : renderTutorDash()
    return renderStudentDash()
  }

  function dashHead(title, sub, action) {
    return `<header class="dash-head">
      <div>
        <p class="eyebrow">${GREETING()}</p>
        <h1>${esc(title)}</h1>
        <p class="muted">${sub}${state.email ? " · " + esc(state.email) : ""}</p>
      </div>
      <div class="rowline">${action || ""}<button class="btn tiny" id="sign-out">Sign out</button></div>
    </header>`
  }

  function renderStudentDash() {
    const doc = myDoc()
    const mine = myCourses()
    const totals = mine.reduce(
      (sum, slug) => {
        const c = counts(doc, slug)
        return { total: sum.total + c.total, covered: sum.covered + c.covered, secure: sum.secure + c.secure }
      },
      { total: 0, covered: 0, secure: 0 },
    )
    const percent = totals.total ? Math.round((totals.covered / totals.total) * 100) : 0
    const booked = slotList()

    const progress = (doc && doc.progress) || {}
    const recent = Object.entries(progress)
      .filter(([, row]) => row.status !== "not_started")
      .sort((a, b) => String(b[1].at || "").localeCompare(String(a[1].at || "")))
      .slice(0, 6)
      .map(([k, row]) => {
        const [slug, index] = k.split(":")
        const course = courseBySlug(slug)
        return { course, topic: course ? course.topics[Number(index)] : "", row }
      })
      .filter((item) => item.course && item.topic)

    return `
      ${dashHead((state.me && state.me.name) || "Your learning", `${esc(doc && doc.stage ? stageLabel(doc.stage) : "No stage set")} · student`, "")}

      <div class="tiles">
        <div class="tile"><span class="tile-label">Courses</span><strong>${mine.length}</strong><span class="muted">on your plan</span></div>
        <div class="tile"><span class="tile-label">Topics covered</span><strong>${totals.covered}<span class="of">/${totals.total}</span></strong><span class="muted">${percent}% of your courses</span></div>
        <div class="tile"><span class="tile-label">Marked secure</span><strong>${totals.secure}</strong><span class="muted">ready for the exam</span></div>
        <div class="tile"><span class="tile-label">Next tutor slot</span><strong class="small-figure">${booked[0] ? esc(WEEKDAYS[booked[0].weekday].short) + " " + esc(booked[0].starts) : "—"}</strong><span class="muted">${booked[0] ? esc(booked[0].subject === "Any" ? "Any subject" : booked[0].subject) : "No hours released"}</span></div>
      </div>

      <section>
        <div class="filters">
          <div>
            <label for="my-stage">Your stage</label>
            <select id="my-stage">
              <option value="">Choose a stage…</option>
              ${STAGES.map((s) => `<option value="${s.id}" ${doc && doc.stage === s.id ? "selected" : ""}>${esc(s.label)}</option>`).join("")}
            </select>
          </div>
          <div>
            <label for="my-add">Add a course</label>
            <select id="my-add">
              <option value="">Choose a course…</option>
              ${sortedCourses
                .filter((c) => !mine.includes(c.slug))
                .map((c) => `<option value="${esc(c.slug)}">${esc(c.title)}</option>`)
                .join("")}
            </select>
          </div>
        </div>
      </section>

      <section>
        <h2>Your courses</h2>
        ${
          mine.length
            ? `<div class="dash-grid">${mine
                .map((slug) => {
                  const course = courseBySlug(slug)
                  const c = counts(doc, slug)
                  return `<article class="dash-card ${subjectClass(course.subject)}">
                    <div class="dash-card-top">
                      ${ring(c.percent, course.subject)}
                      <div>
                        <h3>${esc(course.title)}</h3>
                        <p class="meta">${esc(stageLabel(course.stage))} · ${esc(course.boards)}</p>
                      </div>
                    </div>
                    <p class="muted" style="font-size:0.88rem">${c.covered} of ${c.total} topics covered · ${c.secure} secure</p>
                    <div class="rowline">
                      <button class="btn tiny" data-show-topics="${esc(slug)}">${state.openCourse === slug ? "Hide topics" : "Show topics"}</button>
                      <button class="btn tiny" data-drop="${esc(slug)}">Remove</button>
                    </div>
                    ${state.openCourse === slug ? trackerMarkup(doc, slug, false) : ""}
                  </article>`
                })
                .join("")}</div>`
            : `<div class="empty">No courses yet. Add one above, or open the Courses tab to see what we teach.</div>`
        }
      </section>

      <section>
        <h2>Recent sessions</h2>
        ${
          recent.length
            ? `<ul class="feed">${recent
                .map(
                  (item) => `<li>
                    <span class="feed-tick">${item.row.status === "secure" ? "✔✔" : "✔"}</span>
                    <div>
                      <strong>${esc(item.topic)}</strong>
                      <span class="meta">${esc(item.course.title)} · ${esc(when(item.row.at))}</span>
                      ${item.row.note ? `<p class="note-line">“${esc(item.row.note)}”</p>` : ""}
                    </div>
                  </li>`,
                )
                .join("")}</ul>`
            : `<div class="empty">Nothing ticked off yet — your tutor updates this after each session.</div>`
        }
      </section>

      ${
        booked.length
          ? `<section>
              <h2>Slots released this week</h2>
              <ul class="feed">${booked
                .slice(0, 6)
                .map(
                  (slot) => `<li><span class="feed-time">${WEEKDAYS[slot.weekday].short}</span>
                    <div><strong>${esc(slot.starts)}–${esc(slot.ends)}</strong><span class="meta">${esc(slot.subject === "Any" ? "Any subject" : slot.subject)}${slot.note ? " · " + esc(slot.note) : ""}</span></div></li>`,
                )
                .join("")}</ul>
            </section>`
          : ""
      }`
  }

  function renderTutorDash() {
    const rows = [...state.students.entries()].filter(([, doc]) => (doc.courses || []).length || doc.demoName)
    const week = Date.now() - 7 * 24 * 60 * 60 * 1000
    const ticks = rows.reduce(
      (sum, [, doc]) =>
        sum +
        Object.values(doc.progress || {}).filter(
          (row) => row.status !== "not_started" && Date.parse(row.at || "") >= week,
        ).length,
      0,
    )
    const hours =
      Math.round(
        mySlots().reduce(
          (sum, slot) =>
            sum +
            (Number(slot.ends.slice(0, 2)) * 60 +
              Number(slot.ends.slice(3)) -
              Number(slot.starts.slice(0, 2)) * 60 -
              Number(slot.starts.slice(3))) /
              60,
          0,
        ) * 10,
      ) / 10
    const behind = rows.filter(([, doc]) => {
      const total = (doc.courses || []).reduce((n, slug) => n + counts(doc, slug).total, 0)
      const covered = (doc.courses || []).reduce((n, slug) => n + counts(doc, slug).covered, 0)
      return !total || covered / total < 0.25
    }).length

    return `
      ${dashHead((state.me && state.me.name) || "Your students", `${rows.length} student${rows.length === 1 ? "" : "s"} · tutor`, "")}

      <div class="tiles">
        <div class="tile"><span class="tile-label">Students</span><strong>${rows.length}</strong><span class="muted">you tutor</span></div>
        <div class="tile"><span class="tile-label">Topics ticked</span><strong>${ticks}</strong><span class="muted">in the last 7 days</span></div>
        <div class="tile"><span class="tile-label">Needs attention</span><strong>${behind}</strong><span class="muted">under 25% covered</span></div>
        <div class="tile"><span class="tile-label">Hours published</span><strong>${hours}</strong><span class="muted">across ${mySlots().length} slot${mySlots().length === 1 ? "" : "s"} released</span></div>
      </div>

      <section>
        <h2>Your students</h2>
        ${
          rows.length
            ? rows
                .map(([id, doc]) => {
                  const total = (doc.courses || []).reduce((n, slug) => n + counts(doc, slug).total, 0)
                  const covered = (doc.courses || []).reduce((n, slug) => n + counts(doc, slug).covered, 0)
                  const percent = total ? Math.round((covered / total) * 100) : 0
                  const subject = (doc.courses || [])[0] ? (courseBySlug(doc.courses[0]) || {}).subject : "Maths"
                  return `<article class="student-card">
                    ${ring(percent, subject)}
                    <div class="student-main">
                      <h3>${esc(nameFor(id, doc))}${id === state.uid ? " (you)" : ""}</h3>
                      <p class="meta">${esc(doc.stage ? stageLabel(doc.stage) : "No stage set")} · ${covered}/${total} topics</p>
                      <p class="muted" style="font-size:0.85rem">${(doc.courses || []).length ? (doc.courses || []).map((slug) => esc((courseBySlug(slug) || {}).title || slug)).join(" · ") : "No courses chosen yet"}</p>
                    </div>
                    <button class="btn" data-open-student="${esc(id)}">Open tracker</button>
                  </article>`
                })
                .join("")
            : `<div class="empty">No students yet. Anyone who signs in as a student and picks a course appears here.</div>`
        }
      </section>

      <section>
        <div class="form-card">
          <h2>Release time slots</h2>
          <p class="muted" style="font-size:0.9rem">Students see these under the subject you choose. Overlapping hours on the same day are refused.</p>
          <form id="slot-form">
            <div class="field-row">
              <div><label for="weekday">Day</label>
                <select id="weekday">${WEEKDAYS.map((day) => `<option value="${day.id}">${day.label}</option>`).join("")}</select></div>
              <div><label for="slot-subject">Subject</label>
                <select id="slot-subject">
                  <option value="Any">Any subject</option>
                  ${[...new Set(CATALOGUE.courses.map((c) => c.subject))].sort().map((subject) => `<option value="${esc(subject)}">${esc(subject)}</option>`).join("")}
                </select></div>
            </div>
            <div class="field-row">
              <div><label for="starts">From</label><input id="starts" type="time" value="16:00" required /></div>
              <div><label for="ends">Until</label><input id="ends" type="time" value="18:00" required /></div>
            </div>
            <div><label for="slot-note">Note (optional)</label><input id="slot-note" maxlength="120" placeholder="Online, or at the centre" /></div>
            <div class="rowline"><button class="btn primary" type="submit">Release these hours</button></div>
          </form>
          ${
            mySlots().length
              ? `<ul class="slot-list">${mySlots()
                  .map(
                    (slot, index) => `<li class="slot-row">
                      <span class="slot-day">${WEEKDAYS[slot.weekday].label}</span>
                      <span class="slot-time">${esc(slot.starts)}–${esc(slot.ends)}</span>
                      <span class="slot-detail"><span class="chip">${esc(slot.subject === "Any" ? "Any subject" : slot.subject)}</span>${slot.note ? esc(slot.note) : ""}</span>
                      <button class="btn tiny" data-drop-slot="${index}">Remove</button>
                    </li>`,
                  )
                  .join("")}</ul>`
              : `<p class="meta">No hours released yet.</p>`
          }
        </div>
      </section>

      <section>
        <div class="form-card">
          <h2>Site settings</h2>
          <p class="muted" style="font-size:0.9rem">The name shown in the header, the footer and the browser tab, for everyone who opens this page.</p>
          <form id="site-form">
            <div>
              <label for="site-name">Website name</label>
              <input id="site-name" value="${esc(state.site.name)}" maxlength="40" required />
            </div>
            <div class="rowline"><button class="btn primary" type="submit">Save name</button></div>
          </form>
        </div>
      </section>`
  }

  function renderTracker() {
    const open = state.students.get(state.openStudent)
    if (!open) return renderTutorDash()
    const courses = open.courses || []
    return `
      <div class="panel-head">
        <button class="btn tiny" id="back-to-students">← All students</button>
        <h1>${esc(nameFor(state.openStudent, open))}</h1>
        <p>${esc(open.stage ? stageLabel(open.stage) : "No stage set")} · tick a topic as you cover it and the student sees it in their own dashboard straight away.</p>
      </div>
      ${
        courses.length
          ? courses.map((slug) => trackerMarkup(open, slug, state.writable !== false)).join("")
          : `<div class="empty">This student has not added any courses yet.</div>`
      }`
  }

  /* ---- render and events ------------------------------------------------ */

  const PANELS = {
    subjects: renderSubjects,
    reviews: renderReviews,
    dashboard: renderDashboard,
  }

  function applySite() {
    document.title = state.site.name
    document.getElementById("brand-name").textContent = state.site.name
    document.getElementById("foot-name").textContent = state.site.name
    document.getElementById("crest").textContent = state.site.name.trim().charAt(0).toUpperCase()
  }

  function render() {
    for (const name of Object.keys(PANELS)) {
      const panel = document.getElementById("panel-" + name)
      const tab = document.querySelector('[data-tab="' + name + '"]')
      const active = name === state.tab
      tab.setAttribute("aria-selected", String(active))
      panel.hidden = !active
      if (active) panel.innerHTML = PANELS[name]()
    }
    wire()
  }

  function wire() {
    const panel = document.getElementById("panel-" + state.tab)

    for (const node of panel.querySelectorAll("[data-filter]"))
      node.oninput = () => {
        state.filters[node.dataset.filter] = node.value
        const caret = node.selectionStart
        render()
        const again = document.querySelector('[data-filter="' + node.dataset.filter + '"]')
        if (again && again.tagName === "INPUT") {
          again.focus()
          again.setSelectionRange(caret, caret)
        }
      }

    for (const node of panel.querySelectorAll("[data-course-toggle]"))
      node.onclick = () => {
        const slug = node.dataset.courseToggle
        const mine = myCourses()
        saveStudent({ courses: mine.includes(slug) ? mine.filter((s) => s !== slug) : mine.concat(slug) })
        flash(mine.includes(slug) ? "Removed from your courses" : "Added to your courses")
      }

    for (const node of panel.querySelectorAll("[data-drop-slot]"))
      node.onclick = () => removeSlot(Number(node.dataset.dropSlot))

    const slotForm = panel.querySelector("#slot-form")
    if (slotForm)
      slotForm.onsubmit = (event) => {
        event.preventDefault()
        publishSlot({
          weekday: Number(panel.querySelector("#weekday").value),
          subject: panel.querySelector("#slot-subject").value,
          starts: panel.querySelector("#starts").value,
          ends: panel.querySelector("#ends").value,
          note: panel.querySelector("#slot-note").value.trim().slice(0, 120),
        })
      }

    const signInForm = panel.querySelector("#signin-form")
    if (signInForm)
      for (const node of signInForm.querySelectorAll("button[data-role]"))
        node.onclick = (event) => {
          event.preventDefault()
          chooseRole(node.dataset.role, panel.querySelector("#account-email").value)
        }

    const signOut = panel.querySelector("#sign-out")
    if (signOut)
      signOut.onclick = () => {
        state.account = null
        state.openStudent = null
        state.openCourse = null
        state.email = ""
        writeSignedOut(true)
        render()
        flash("Signed out")
      }

    for (const node of panel.querySelectorAll("[data-show-topics]"))
      node.onclick = () => {
        state.openCourse = state.openCourse === node.dataset.showTopics ? null : node.dataset.showTopics
        render()
      }

    for (const node of panel.querySelectorAll("[data-drop]"))
      node.onclick = () => {
        saveStudent({ courses: myCourses().filter((slug) => slug !== node.dataset.drop) })
        flash("Course removed")
      }

    const siteForm = panel.querySelector("#site-form")
    if (siteForm)
      siteForm.onsubmit = (event) => {
        event.preventDefault()
        const name = panel.querySelector("#site-name").value.trim()
        if (name.length < 2 || name.length > 40) return flash("The site name must be between 2 and 40 characters.")
        renameSite(name)
      }

    for (const node of panel.querySelectorAll("[data-open-student]"))
      node.onclick = () => {
        state.openStudent = node.dataset.openStudent
        render()
      }

    const back = panel.querySelector("#back-to-students")
    if (back)
      back.onclick = () => {
        state.openStudent = null
        render()
      }

    for (const node of panel.querySelectorAll("[data-status]"))
      node.onclick = () => {
        const noteInput = panel.querySelector('[data-note="' + CSS.escape(node.dataset.topic) + '"]')
        setStatus(state.openStudent, node.dataset.topic, node.dataset.status, noteInput ? noteInput.value : undefined)
      }

    for (const node of panel.querySelectorAll("[data-note]"))
      node.onkeydown = (event) => {
        if (event.key !== "Enter") return
        event.preventDefault()
        const doc = state.students.get(state.openStudent) || {}
        const current = ((doc.progress || {})[node.dataset.note] || {}).status || "covered"
        setStatus(state.openStudent, node.dataset.note, current, node.value)
        flash("Note saved")
      }

    const stage = panel.querySelector("#my-stage")
    if (stage)
      stage.onchange = () => {
        if (!stage.value) return
        saveStudent({ stage: stage.value })
        flash("Stage saved")
      }

    const add = panel.querySelector("#my-add")
    if (add)
      add.onchange = () => {
        if (!add.value) return
        saveStudent({ courses: myCourses().concat(add.value) })
        flash("Course added")
      }

    const form = panel.querySelector("#review-form")
    if (form)
      form.onsubmit = (event) => {
        event.preventDefault()
        const title = form.querySelector("#r-title").value.trim()
        const text = form.querySelector("#r-body").value.trim()
        if (title.length < 3) return flash("Please give your review a short title.")
        if (text.length < 20) return flash("Please write at least 20 characters so the review is useful.")
        addReview({
          title,
          body: text,
          rating: Number(form.querySelector("#r-rating").value),
          course: form.querySelector("#r-course").value,
        })
        form.reset()
      }
  }

  for (const tab of document.querySelectorAll(".tab")) {
    tab.onclick = () => {
      state.tab = tab.dataset.tab
      if (state.tab !== "dashboard") state.openStudent = null
      render()
    }
    tab.onkeydown = (event) => {
      const tabs = [...document.querySelectorAll(".tab")]
      const step = event.key === "ArrowRight" ? 1 : event.key === "ArrowLeft" ? -1 : 0
      if (!step) return
      event.preventDefault()
      const next = tabs[(tabs.indexOf(tab) + step + tabs.length) % tabs.length]
      next.focus()
      next.click()
    }
  }

  function renderViewer() {
    const node = document.getElementById("viewer")
    if (!state.uid) {
      node.innerHTML = '<span>Viewing as a guest</span>'
      return
    }
    const name = (state.me && state.me.name) || "your account"
    node.innerHTML =
      (state.me && state.me.avatarUrl ? '<img alt="" src="' + esc(state.me.avatarUrl) + '" />' : "") +
      "<span>Signed in as <strong>" +
      esc(name) +
      "</strong></span>"
  }

  render()
  renderViewer()

  /* ---- capabilities ----------------------------------------------------- */

  let profileKey = ""
  async function syncProfiles() {
    if (!state.user) return
    const ids = [...state.students.keys()]
      .concat([...state.slots.keys()])
      .concat(state.reviews.map((r) => r.by))
      .filter((id) => id && !String(id).startsWith("demo_"))
    const unique = [...new Set(ids)]
    if (!unique.length) return
    const resolved = await state.user.profiles(unique)
    const signature = unique.map((id) => id + ":" + ((resolved[id] || {}).name || "")).join("|")
    state.profiles = resolved
    if (signature !== profileKey) {
      profileKey = signature
      render()
    }
  }

  async function boot() {
    if (typeof claude === "undefined" || !claude || typeof claude.use !== "function") return

    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")])
    state.db = db
    state.user = user

    if (user) {
      state.me = await user.me()
      state.uid = state.me.id
      state.writable = await user.can("data.write")
      renderViewer()
      render()
    }

    if (!db) {
      document.getElementById("foot-note").textContent =
        "Shared data is unavailable in this view, so the timetable and reviews are showing the catalogue only."
      return
    }

    state.shared = true
    const onError = () => flash("Live updates stopped. Reload the page to reconnect.")

    db.doc("settings/site").onSnapshot((snap) => {
      const stored = snap.exists ? snap.data() : null
      if (stored && stored.name) {
        state.site = { name: String(stored.name) }
        applySite()
        render()
      }
    }, onError)

    db.collection("accounts").onSnapshot((snap) => {
      state.accounts = new Map(snap.docs.map((doc) => [doc.id, doc.data()]))
      render()
      syncProfiles()
    }, onError)

    if (state.uid) {
      const [account, profile] = await Promise.all([
        db.doc("accounts/" + state.uid).get(),
        db.doc("data/users/" + state.uid + "/profile").get(),
      ])
      state.email = (profile.exists && profile.data().email) || ""
      // An account without a stored email predates the email requirement: ask again.
      state.account = account.exists && state.email && !readSignedOut() ? account.data() : null
      render()
    }

    db.collection("students").onSnapshot((snap) => {
      const incoming = new Map(snap.docs.map((doc) => [doc.id, doc.data()]))
      // Keep an unsaved local record for a student who has only just signed in.
      if (state.uid && state.students.has(state.uid) && !incoming.has(state.uid))
        incoming.set(state.uid, state.students.get(state.uid))
      state.students = incoming
      render()
      syncProfiles()
    }, onError)

    db.collection("availability").onSnapshot((snap) => {
      state.slots = new Map(snap.docs.map((doc) => [doc.id, doc.data()]))
      render()
      syncProfiles()
    }, onError)

    db.collection("reviews")
      .orderBy("at", "desc")
      .limit(60)
      .onSnapshot((snap) => {
        state.reviews = snap.docs.map((doc) => Object.assign({ id: doc.id }, doc.data()))
        render()
        syncProfiles()
      }, onError)
  }

  boot()
</script>
